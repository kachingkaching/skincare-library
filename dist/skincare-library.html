<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skincare Library</title>
<link rel="icon" href="data:,">
<style>
/* ============================================================
   Skincare Library — art direction after Aesop
   Bone ground, hairline rules, one grotesque, no ornament.
   ============================================================ */

:root {
  --bone:       #F6F3ED;
  --bone-deep:  #EDE8DF;
  --bone-sink:  #E5DFD3;
  --ink:        #1B1A17;
  --ink-muted:  #6E6A60;
  --rule:       #DFD8CB;
  --amber:      #7A5A2E;

  --sans: "Suisse Int'l", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --gutter: 48px;
  --ease: 200ms ease;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bone);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img { max-width: 100%; display: block; }

/* Author styles beat the UA sheet, so [hidden] needs restating. */
[hidden] { display: none !important; }

a { color: inherit; text-decoration: none; }

button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- type ---------- */

.label,
.nav a,
.wordmark,
.btn,
.chip,
.colophon,
.filter-bar label,
.field > label,
th {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.4;
}

h1, h2, h3 { font-weight: 400; margin: 0; }

.page-title {
  font-size: 32px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0;
}

.section-title {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
  margin: 0 0 24px;
}

/* A heading that carries a whole section of the page, rather than labelling a
   column of it. No rule beneath: the thing it introduces has its own. */
.block-title {
  font-size: 21px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
}

.muted { color: var(--ink-muted); }

.prose { max-width: 62ch; }

/* ---------- masthead ---------- */

.masthead {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bone);
  border-bottom: 1px solid var(--rule);
}

.masthead-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 22px var(--gutter);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 32px;
}

.wordmark { letter-spacing: 0.22em; }

.mast-left { display: flex; align-items: baseline; gap: 24px; min-width: 0; }

/* Whose shelf you are looking at — always in view, never shouting. */
.profile-switch {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  padding: 2px 0;
  max-width: 170px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: color var(--ease), border-color var(--ease);
}

.profile-switch:hover,
.profile-switch:focus { color: var(--ink); border-bottom-color: var(--ink); outline: none; }

.nav { display: flex; gap: 28px; flex-wrap: wrap; }

.nav a {
  color: var(--ink-muted);
  transition: color var(--ease);
  padding-bottom: 2px;
}

.nav a:hover { color: var(--ink); }

.nav a.is-active {
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
}

/* ---------- language ----------

   At the right-hand end of the navigation: a button showing the language you
   are in, and a short menu of the others under it. */

.lang { position: relative; }

.lang-btn {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: none;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 3px 10px;
  cursor: pointer;
  transition: color var(--ease), border-color var(--ease);
}

.lang-btn:hover, .lang-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--ink); }
.lang-btn:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }

.lang-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 30;
  min-width: 132px;
  background: var(--bone);
  border: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
}

.lang-option {
  background: none;
  border: none;
  border-radius: 0;
  padding: 10px 14px;
  text-align: left;
  white-space: nowrap;
  font-size: 13px;
  color: var(--ink-muted);
  cursor: pointer;
  transition: background var(--ease), color var(--ease);
}

.lang-option:hover { background: var(--bone-deep); color: var(--ink); }
.lang-option.is-on { color: var(--ink); }
.lang-option.is-on::before { content: '· '; }

/* ---------- shell ---------- */

.view {
  max-width: 1400px;
  margin: 0 auto;
  padding: 64px var(--gutter) 96px;
  min-height: 60vh;
}

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}

.colophon {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px var(--gutter) 48px;
  border-top: 1px solid var(--rule);
  color: var(--ink-muted);
  display: flex;
  justify-content: space-between;
  gap: 24px;
}

/* ---------- controls ---------- */

.btn {
  display: inline-block;
  background: none;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 12px 22px;
  cursor: pointer;
  transition: background var(--ease), color var(--ease), opacity var(--ease);
}

.btn:hover { background: var(--ink); color: var(--bone); }

.btn-quiet {
  border-color: var(--rule);
  color: var(--ink-muted);
}

.btn-quiet:hover { background: none; border-color: var(--ink); color: var(--ink); }

.btn-danger:hover { background: var(--amber); border-color: var(--amber); color: var(--bone); }

.btn:disabled { opacity: 0.35; cursor: default; }
.btn:disabled:hover { background: none; color: var(--ink); }

.btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.field { margin-bottom: 28px; }

.field > label {
  display: block;
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field input[type="password"],
.field select,
.field textarea {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 8px 0;
  border-radius: 0;
  transition: border-color var(--ease);
  -webkit-appearance: none;
  appearance: none;
}

.field select {
  background-image: none;
  cursor: pointer;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-bottom-color: var(--ink);
}

.field textarea { resize: vertical; min-height: 120px; line-height: 1.7; }

.field-hint { color: var(--ink-muted); font-size: 13px; margin-top: 8px; }

.field-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}

/* radio / checkbox sets */

.choices { display: flex; flex-wrap: wrap; gap: 10px; }

.choices input { position: absolute; opacity: 0; pointer-events: none; }

.choices label {
  border: 1px solid var(--rule);
  padding: 9px 16px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  transition: color var(--ease), border-color var(--ease), background var(--ease);
}

.choices label:hover { color: var(--ink); border-color: var(--ink); }

.choices input:checked + label {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bone);
}

.choices input:focus-visible + label { outline: 1px solid var(--amber); outline-offset: 2px; }

/* ---------- filter bar ---------- */

.filter-bar {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
  align-items: center;
  padding: 16px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 48px;
}

.filter {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.filter label { color: var(--ink-muted); }

.filter select {
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  padding: 2px 0;
  cursor: pointer;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--ease);
}

.filter select:hover, .filter select:focus { border-bottom-color: var(--ink); outline: none; }

.filter-count { margin-left: auto; color: var(--ink-muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

/* ---------- shelf ---------- */

.shelf {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 56px 32px;
}

.shelf-item { display: block; }

.shelf-link { display: block; }

/* An emptied product is still on the shelf, just clearly spent. */
.shelf-item.is-empty .shelf-link { opacity: 0.45; }

/* How many you have, over the corner of the photograph. Only shown above one —
   a "1" on every card would be noise. */
.shelf-frame { position: relative; }

.shelf-tally {
  position: absolute;
  top: 0;
  right: 0;
  min-width: 30px;
  padding: 5px 8px;
  background: var(--ink);
  color: var(--bone);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-align: center;
}

/* Counting up and down without leaving the shelf. */
.stepper {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}

.step-btn {
  width: 26px;
  height: 26px;
  padding: 0;
  line-height: 1;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 0;
  color: var(--ink-muted);
  cursor: pointer;
  transition: border-color var(--ease), color var(--ease), background var(--ease);
}

.step-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.step-btn:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }
.step-btn:disabled { opacity: 0.3; cursor: default; }

.stepper-count {
  min-width: 2ch;
  text-align: center;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.shelf-frame {
  background: var(--bone-deep);
  aspect-ratio: 4 / 5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 18px;
}

.shelf-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity var(--ease);
}

.shelf-item:hover .shelf-frame img { opacity: 0.82; }

.shelf-frame .no-image {
  color: var(--ink-muted);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.shelf-brand {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.shelf-name { font-size: 16px; line-height: 1.4; }

.shelf-meta {
  margin-top: 6px;
  color: var(--ink-muted);
  font-size: 13px;
}

/* ---------- product detail ---------- */

.detail {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: 80px;
  align-items: start;
}

.detail-frame {
  background: var(--bone-deep);
  aspect-ratio: 4 / 5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: sticky;
  top: 110px;
}

.detail-frame img { width: 100%; height: 100%; object-fit: cover; }

.detail-brand {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 12px;
}

.detail-title { font-size: 34px; line-height: 1.15; margin-bottom: 28px; }

.spec {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 0;
  border-top: 1px solid var(--rule);
}

.spec dt {
  padding: 12px 0;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 1px solid var(--rule);
}

.spec dd {
  margin: 0;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
}

.block { margin-top: 56px; }

/* actives summary */

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  border: 1px solid var(--rule);
  padding: 6px 12px;
  color: var(--ink-muted);
}

.chip-active { border-color: var(--amber); color: var(--amber); }
.chip-flag { border-color: var(--amber); color: var(--amber); }

/* ingredient rows */

.ing-list { border-top: 1px solid var(--rule); }

.ing {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 20px;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}

.ing-index { color: var(--ink-muted); font-size: 11px; letter-spacing: 0.08em; }
.ing-name { line-height: 1.4; }
.ing-fn { color: var(--ink-muted); font-size: 13px; line-height: 1.55; }
.ing-unknown .ing-fn { font-style: italic; }
.ing-flagged .ing-name { color: var(--amber); }

.ing-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 1px solid var(--rule);
}

.tag-flag { color: var(--amber); border-bottom-color: var(--amber); }

/* ---------- notices ---------- */

.notice {
  border-left: 1px solid var(--amber);
  padding: 4px 0 4px 20px;
  color: var(--ink-muted);
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 16px;
}

.notice strong { color: var(--amber); font-weight: 400; }

.caveat {
  border: 1px solid var(--rule);
  padding: 20px 24px;
  color: var(--ink-muted);
  font-size: 13px;
  line-height: 1.65;
  margin-bottom: 48px;
}

/* ---------- empty state ---------- */

.empty {
  border-top: 1px solid var(--rule);
  padding-top: 48px;
  max-width: 46ch;
}

.empty p { color: var(--ink-muted); margin: 0 0 24px; }

/* ---------- upload ---------- */

.dropzone {
  background: var(--bone-deep);
  border: 1px solid var(--rule);
  aspect-ratio: 4 / 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  cursor: pointer;
  text-align: center;
  padding: 24px;
  transition: border-color var(--ease), background var(--ease);
  position: relative;
  overflow: hidden;
}

.dropzone:hover, .dropzone.is-over { border-color: var(--ink); }

.dropzone p {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.dropzone img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.dropzone input[type="file"] { display: none; }

.form-grid {
  display: grid;
  grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
  gap: 80px;
  align-items: start;
}

/* ---------- assessment ---------- */

.assess-grid {
  display: grid;
  grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
  gap: 80px;
  align-items: start;
}

.reading { border-top: 1px solid var(--rule); }

.reading-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1.4fr);
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}

.severity {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.severity-marked { color: var(--amber); }

.reading-note { color: var(--ink-muted); font-size: 13px; }

.routine-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
}

.step {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 20px;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}

.step-num { color: var(--ink-muted); font-size: 11px; letter-spacing: 0.08em; }
.step-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
.step-product { line-height: 1.4; }
.step-empty { color: var(--ink-muted); font-style: italic; }
.step-note { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }

.history { border-top: 1px solid var(--rule); }

.history-row {
  display: flex;
  gap: 24px;
  align-items: baseline;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  width: 100%;
  text-align: left;
  background: none;
  border-left: none;
  border-right: none;
  border-top: none;
  cursor: pointer;
  transition: opacity var(--ease);
}

.history-row:hover { opacity: 0.6; }
.history-date { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); min-width: 140px; }

/* ---------- routine builder ---------- */

.picker { border-top: 1px solid var(--rule); }

.picker-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
}

.picker-row .grow { flex: 1; min-width: 0; }
.picker-row .picker-step { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }

.link-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  color: var(--ink-muted);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: color var(--ease);
}

.link-btn:hover { color: var(--ink); }

/* Profile names are edited in place; the rule appears on approach. */
.profile-name {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  border-radius: 0;
  padding: 4px 0;
  transition: border-color var(--ease);
}

.profile-name:hover { border-bottom-color: var(--rule); }
.profile-name:focus { border-bottom-color: var(--ink); outline: none; }

/* ---------- header marks ---------- */

.view-head { position: relative; }

/* Sits with the title, not over it: quiet enough to read as a printer's device. */
.header-art {
  width: 88px;
  height: 52px;
  flex: 0 0 auto;
  order: -1;
  margin-bottom: -6px;
  fill: none;
  stroke: var(--ink-muted);
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.55;
}

.view-head > .page-title { flex: 1 1 auto; }

@media (max-width: 720px) {
  .header-art { width: 68px; height: 40px; }
}

/* ---------- disclosure header ----------

   Used by the complete routine, which folds away under the week. */

.week-day {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.day-head {
  display: flex;
  gap: 24px;
  align-items: baseline;
  width: 100%;
  padding: 16px 0;
  text-align: left;
  background: none;
  border: none;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  cursor: pointer;
  transition: opacity var(--ease);
}

.day-head:hover { opacity: 0.62; }
.day-head:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }
.day-head .week-day { min-width: 140px; flex: 0 0 auto; }
.day-head .grow { flex: 1; min-width: 0; }

/* ---------- the week, as seven cards ----------

   Seven cards standing side by side across the page. The chosen one is filled
   in ink, and its morning and evening open out directly underneath the row.
   Below tablet width the row scrolls sideways rather than crushing the cards. */

.week-strip {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.week-strip::-webkit-scrollbar { display: none; }

.day-card {
  flex: 1 1 0;
  min-width: 118px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 24px;
  min-height: 128px;
  padding: 18px 18px 16px;
  text-align: left;
  background: none;
  border: 1px solid var(--rule);
  border-radius: 0;
  cursor: pointer;
  transition: border-color var(--ease), background var(--ease), color var(--ease);
}

.day-card:hover { border-color: var(--ink); }
.day-card:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }

.day-card.is-on {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bone);
}

.day-card-name { font-size: 22px; line-height: 1.1; letter-spacing: -0.01em; }

.day-card-foot {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.day-card.is-on .day-card-foot { color: var(--bone-sink); }

.day-card-today { color: var(--amber); }
.day-card.is-on .day-card-today { color: var(--bone); }

.day-card-clash { color: var(--amber); }
.day-card.is-on .day-card-clash { color: var(--bone); }

.day-body { padding: 40px 0 40px; }

/* The save belongs at the end of the editing, where the eye already is. */
.day-save { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--rule); }

.btn-lg { padding: 15px 34px; font-size: 12px; }

/* Selects that sit in a row of text rather than in a labelled field. */
.inline-select {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 4px 0;
  border-radius: 0;
  cursor: pointer;
  transition: border-color var(--ease);
}

.inline-select:hover, .inline-select:focus { border-bottom-color: var(--ink); outline: none; }

/* day toggles on a routine row */

.day-summary { white-space: nowrap; }
.day-some { color: var(--amber); }

.day-picker { display: inline-flex; align-items: center; gap: 4px; }

.day {
  width: 22px;
  height: 22px;
  padding: 0;
  border: 1px solid var(--rule);
  background: none;
  border-radius: 0;
  cursor: pointer;
  font-size: 10px;
  letter-spacing: 0;
  color: var(--ink-muted);
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}

.day:hover { border-color: var(--ink); color: var(--ink); }
.day.is-on { background: var(--ink); border-color: var(--ink); color: var(--bone); }

/* ---------- assessment history ---------- */

.history-item { border-bottom: 1px solid var(--rule); }
.history-item .history-row { border-bottom: none; }
.history-row .grow { flex: 1; min-width: 0; }

.history-mark {
  font-size: 14px;
  color: var(--ink-muted);
  min-width: 14px;
  text-align: right;
}

.history-body { padding: 8px 0 0; }

.history-photo {
  background: var(--bone-deep);
  max-width: 260px;
  margin-bottom: 32px;
  overflow: hidden;
}

.history-photo img { width: 100%; height: auto; }

/* ---------- waiting ---------- */

/* Three dots, for anything that has gone away to think. Sized off the text it
   sits in, so it works inside a button and inside a sentence. */
.dots {
  display: inline-flex;
  align-items: center;
  gap: 0.32em;
  vertical-align: baseline;
  margin-left: 0.15em;
}

.dots i {
  width: 0.28em;
  height: 0.28em;
  min-width: 3px;
  min-height: 3px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.25;
  animation: dot-drift 1.25s infinite ease-in-out;
}

.dots i:nth-child(2) { animation-delay: 0.16s; }
.dots i:nth-child(3) { animation-delay: 0.32s; }

@keyframes dot-drift {
  0%, 65%, 100% { opacity: 0.25; transform: translateY(0); }
  32%           { opacity: 1;    transform: translateY(-0.18em); }
}

@media (prefers-reduced-motion: reduce) {
  .dots i { animation: none; opacity: 0.55; }
}

/* ---------- chat ---------- */

/* A speech cloud rather than a bar: at this size it is unmissable, and it says
   what it does without a word of instruction. */
.chat-launch {
  position: fixed;
  right: var(--gutter);
  bottom: 20px;
  z-index: 40;
  width: 132px;
  height: 106px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  transition: transform var(--ease), opacity var(--ease);
}

.chat-launch svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* Body and tail are two overlapping shapes rather than one outline: a single
   path leaves a nick where the tail meets the curve, and it shows at this size. */
.chat-launch .cloud { fill: var(--ink); }

.chat-launch text {
  fill: var(--bone);
  font-family: var(--sans);
  font-size: 17px;
  letter-spacing: 0.18em;
  text-anchor: middle;
}

.chat-launch:hover { transform: translateY(-2px); opacity: 0.9; }
.chat-launch:focus-visible { outline: 1px solid var(--amber); outline-offset: 4px; }

@media (prefers-reduced-motion: reduce) {
  .chat-launch:hover { transform: none; }
}

.chat-panel {
  position: fixed;
  right: var(--gutter);
  bottom: 28px;
  z-index: 41;
  width: 380px;
  max-width: calc(100vw - var(--gutter) * 2);
  height: 520px;
  max-height: calc(100vh - 120px);
  background: var(--bone);
  border: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
}

.chat-head {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule);
}

.chat-log {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.chat-turn { margin-bottom: 20px; }

.chat-who {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 6px;
}

.chat-user .chat-who { color: var(--amber); }

.chat-text { font-size: 14px; line-height: 1.6; }

.chat-form {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 16px 20px;
  border-top: 1px solid var(--rule);
}

.chat-form input {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  padding: 6px 0;
  transition: border-color var(--ease);
}

.chat-form input:focus { outline: none; border-bottom-color: var(--ink); }
.chat-form .btn { padding: 9px 16px; }

/* ---------- discoveries ---------- */

.carousel { border-top: 1px solid var(--rule); }

.carousel-track {
  display: flex;
  gap: 40px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  padding-bottom: 8px;
  scrollbar-width: none;
}

.carousel-track::-webkit-scrollbar { display: none; }
.carousel-track:focus-visible { outline: 1px solid var(--amber); outline-offset: 6px; }

.pick {
  flex: 0 0 340px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pick-art { width: 100%; height: auto; display: block; }

/* Above the pictures, where the eye is before it starts reading a card. */
.carousel-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 0 28px;
}

.carousel-dots { display: flex; gap: 8px; flex: 1; justify-content: center; }

.carousel-dot {
  width: 6px;
  height: 6px;
  padding: 0;
  border: 1px solid var(--ink-muted);
  background: none;
  border-radius: 50%;
  cursor: pointer;
  transition: background var(--ease), border-color var(--ease);
}

.carousel-dot.is-on { background: var(--ink); border-color: var(--ink); }
.link-btn:disabled { opacity: 0.3; cursor: default; }

.pick-brand {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.pick-name { font-size: 17px; line-height: 1.35; }
.pick-kind { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }
.pick-why { line-height: 1.6; margin-top: 10px; }
.pick-meta { color: var(--ink-muted); font-size: 13px; margin-top: 10px; }

/* The picture and the name both go where the product was found. */
.pick-link { display: block; transition: opacity var(--ease); }
.pick-link:hover { opacity: 0.72; }
.pick-name .pick-link { display: inline; }
.pick-out { color: var(--ink-muted); font-size: 13px; }

.pick-more { margin-top: 16px; }

.pick-details {
  margin-top: 4px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
}

/* ---------- responsive ---------- */

/* Four across is right at full width; below that the frames get too small to
   read a label in, so drop a column at a time. */
@media (max-width: 1240px) {
  .shelf { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 1080px) {
  :root { --gutter: 32px; }
  .shelf { grid-template-columns: repeat(2, 1fr); gap: 48px 32px; }
  .detail, .form-grid, .assess-grid { grid-template-columns: 1fr; gap: 48px; }
  .detail-frame { position: static; max-width: 480px; }
  .routine-cols { gap: 48px; }
}

@media (max-width: 720px) {
  :root { --gutter: 20px; }
  body { font-size: 14px; }
  .view { padding: 40px var(--gutter) 64px; }
  .masthead-inner { flex-direction: column; align-items: flex-start; gap: 16px; padding: 18px var(--gutter); }
  .mast-left { gap: 14px; }
  .profile-switch { max-width: 120px; }
  .nav { gap: 18px; }
  .shelf { grid-template-columns: 1fr; gap: 40px; }
  .page-title { font-size: 26px; }
  .detail-title { font-size: 26px; }
  .field-pair { grid-template-columns: 1fr; gap: 0; }
  .routine-cols { grid-template-columns: 1fr; }
  .spec { grid-template-columns: 110px 1fr; }
  .ing { grid-template-columns: 22px 1fr; }
  .ing-fn { grid-column: 2; }
  .reading-row { grid-template-columns: 1fr; gap: 4px; }
  .filter-bar { gap: 20px; }
  .colophon { flex-direction: column; gap: 8px; }
  .pick { flex-basis: 78vw; }
  .day-head { gap: 14px; }
  .day-head .week-day { min-width: 0; }
  .day-card { min-width: 104px; min-height: 108px; padding: 14px; }
  .day-card-name { font-size: 19px; }
  .day-body { padding: 28px 0; }
  .chat-panel { left: var(--gutter); right: var(--gutter); width: auto; height: 70vh; }
  .chat-launch { right: 12px; bottom: 12px; width: 112px; height: 90px; }
}

</style>
</head>

/* ===== js/i18n.js ===== */
/* Interface language.

   Three languages, one flat dictionary each, keyed by dotted names. `t()` is
   synchronous and never throws: an untranslated key falls back to English and
   an unknown key returns itself, so a missing string shows up in the interface
   as a visible key rather than as a blank space or a crash.

   The chosen language is read from IndexedDB once at boot, before the first
   render, and held in a module variable — every view calls `t()` while building
   its markup, and none of them can await.

   INCI names are deliberately left as printed. They appear in Latin on the pack
   in every market, and matching what you are holding against what is on screen
   matters more than reading it in your own language. Everything *about* an
   ingredient — what it does, and its tags — is translated. */



/* This module imports nothing but data, on purpose. Everything else in the app
   needs `t()`, including store.js and rules.js, so anything it imported back
   would close a cycle — which ES modules tolerate and the flattened share build
   does not. Reading and writing the stored preference is therefore the caller's
   job; see `applyLang` and app.js. */

const LANGS = [
  { id: 'en',      label: 'English',  short: 'EN' },
  { id: 'zh-Hant', label: '繁體中文', short: '繁' },
  { id: 'zh-Hans', label: '简体中文', short: '简' }
];

let current = 'en';

const lang = () => current;

/* What the model is told to write in. */
const LANG_NAME = {
  en: 'English',
  'zh-Hant': 'Traditional Chinese (繁體中文), as written in Hong Kong and Taiwan',
  'zh-Hans': 'Simplified Chinese (简体中文)'
};

/* A stored choice wins; failing that, take the browser's own preference, so a
   Chinese-language browser opens in Chinese without being asked. */
function chooseLang(stored) {
  if (stored && LANGS.some(l => l.id === stored)) return stored;
  const tags = navigator.languages || [navigator.language || 'en'];
  const zh = tags.find(x => /^zh/i.test(x));
  if (zh) return /hant|tw|hk|mo/i.test(zh) ? 'zh-Hant' : 'zh-Hans';
  return 'en';
}

function applyLang(id) {
  current = LANGS.some(l => l.id === id) ? id : 'en';
  document.documentElement.lang = current;
  return current;
}

/* t('key') or t('key', { n: 3 }) — {n} in the string is replaced. */
function t(key, vars) {
  const table = DICT[current] || DICT.en;
  let s = table[key];
  if (s === undefined) s = DICT.en[key];
  if (s === undefined) return key;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) s = s.split(`{${k}}`).join(v);
  }
  return s;
}

/* English pluralises, Chinese does not. */
const plural = (n, one, many) =>
  (current === 'en' ? t(n === 1 ? one : many, { n }) : t(many, { n }));

/* Chinese separates a list with an ideographic comma, not a Latin one. */
const listSep = () => (current === 'en' ? ', ' : '、');

/* Labels that live as data elsewhere — the English in rules.js and
   ingredients.js stays the source, and these translate it on the way out.
   An unknown value falls through to itself rather than showing a raw key. */
const viaKey = (prefix, value) => {
  const key = prefix + value;
  const s = t(key);
  return s === key ? value : s;
};

const tagLabel = tag => viaKey('tag.', tag);
const statusLabel = status => viaKey('status.', status);
const severityLabel = sev => viaKey('sev.', sev);
const categoryLabel = cat => viaKey('cat.', cat);
const stepLabel = step => viaKey('step.', step.key ?? step);
const concernLabel = concern => viaKey('concern.', concern.key ?? concern);
const dayLabel = day => viaKey('day.', day);

/* The sentence explaining an ingredient. The INCI name is left as printed. */
function ingredientText(entry) {
  if (!entry) return '';
  const table = current === 'zh-Hant' ? ING_HANT : current === 'zh-Hans' ? ING_HANS : null;
  return (table && table[entry.k]) || entry.f;
}

/* Keys present in English but missing elsewhere fall back silently, which is
   the right behaviour in front of a user and the wrong one for whoever is
   maintaining the tables. Exposed so it can be checked from the console. */
function missingKeys() {
  const out = {};
  for (const [id, table] of Object.entries(DICT)) {
    if (id === 'en') continue;
    out[id] = Object.keys(en).filter(k => !(k in table));
  }
  return out;
}

/* Lowercase, strip the decoration ingredient lists collect. */
function normalize(raw) {
  return String(raw)
    .toLowerCase()
    .replace(/\[[^\]]*\]/g, ' ')
    .replace(/\*+/g, ' ')
    .replace(/[.,;:•]+\s*$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

const stripParens = s => s.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();

/* Resolve one ingredient name to a dictionary entry, or null. */
function lookup(raw) {
  const forms = [];
  const base = normalize(raw);
  forms.push(base);
  const bare = stripParens(base);
  if (bare !== base) forms.push(bare);
  // "Butyrospermum Parkii (Shea) Butter" -> "butyrospermum parkii butter"
  const collapsed = base.replace(/\(([^)]*)\)/g, ' ').replace(/\s+/g, ' ').trim();
  if (!forms.includes(collapsed)) forms.push(collapsed);

  for (const form of forms) {
    if (ALIASES[form] && INGREDIENTS[ALIASES[form]]) return INGREDIENTS[ALIASES[form]];
    if (INGREDIENTS[form]) return INGREDIENTS[form];
  }
  return null;
}

/* Turn a pasted INCI list into an array of trimmed names. */
function parseIngredients(text) {
  if (!text) return [];
  return String(text)
    .replace(/^\s*ingredients?\s*[:\-]\s*/i, '')
    .replace(/\(and\)/gi, ',')
    .split(/[,\n;•]+/)
    .map(s => s.replace(/^\s*\d+[).]\s*/, '').replace(/\s+/g, ' ').trim())
    .map(s => s.replace(/[.\s]+$/, ''))
    .filter(Boolean);
}

/* Every tag present in a product's ingredient list. */
function tagsFor(ingredients = []) {
  const set = new Set();
  for (const name of ingredients) {
    const entry = lookup(name);
    if (entry) entry.t.forEach(t => set.add(t));
  }
  return set;
}

/* Weight by position: what appears early is present in quantity. */
function weightedTags(ingredients = []) {
  const weights = new Map();
  const n = ingredients.length || 1;
  ingredients.forEach((name, i) => {
    const entry = lookup(name);
    if (!entry) return;
    const pos = i / n;
    const w = pos < 0.34 ? 1 : pos < 0.67 ? 0.6 : 0.3;
    for (const tag of entry.t) {
      weights.set(tag, Math.max(weights.get(tag) || 0, w));
    }
  });
  return weights;
}

const activesIn = ingredients =>
  ACTIVE_TAGS.filter(t => tagsFor(ingredients).has(t));

const flagsIn = ingredients =>
  FLAG_TAGS.filter(t => tagsFor(ingredients).has(t));

  return chosen.slice().sort((a, b) => a - b).map(dayLabel).join(' · ');
}

/* ---------- layering conflicts ---------- */

const hasIngredient = (product, name) =>
  (product.ingredients || []).some(i => normalize(i) === name);

const productTags = product => tagsFor(product.ingredients || []);

/* `products` are the product objects placed in one period of a routine. */
function conflictsFor(products, period) {
  const notes = [];
  const withTag = tag => products.filter(p => productTags(p).has(tag));

  const retinoids = withTag('retinoid');
  const ahas = withTag('aha').filter(p => p.category !== 'Sunscreen');
  const bhas = withTag('bha');
  const filters = withTag('uv-filter');
  const acids = [...new Set([...ahas, ...bhas])];

  if (retinoids.length && acids.length) {
    notes.push({
      severity: 'high',
      text: t('clash.retinoidAcid', { a: retinoids[0].name, b: acids[0].name })
    });
  }
  if (ahas.length && bhas.length) {
    notes.push({
      severity: 'medium',
      text: t('clash.ahaBha')
    });
  }
  if (retinoids.length > 1) {
    notes.push({ severity: 'medium', text: t('clash.twoRetinoids') });
  }
  if (period === 'am' && (retinoids.length || acids.length)) {
    notes.push({
      severity: 'medium',
      text: t('clash.amActives')
    });
  }
  if (period === 'am' && !filters.length && products.length) {
    notes.push({ severity: 'high', text: t('clash.noSunscreen') });
  }
  const bp = products.filter(p => hasIngredient(p, 'benzoyl peroxide'));
  if (bp.length && retinoids.length) {
    notes.push({ severity: 'medium', text: t('clash.bpRetinoid') });
  }
  const vitc = withTag('vitamin-c');
  if (vitc.length && retinoids.length) {
    notes.push({ severity: 'low', text: t('clash.vitcRetinoid') });
  }
  const fragranced = withTag('fragrance').concat(withTag('essential-oil'));
  if (new Set(fragranced).size >= 3) {
    notes.push({ severity: 'low', text: t('clash.fragrance') });
  }
  return notes;
}

   are the exceptions: images are referenced by id, and the key is a property of
   the machine rather than of a person. */



const DB_NAME = 'skincare';
const DB_VERSION = 2;
const STORES = ['products', 'images', 'assessments', 'profiles', 'meta'];

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = event => {
      const db = req.result;
      const tx = req.transaction;

      if (!db.objectStoreNames.contains('products')) db.createObjectStore('products', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('assessments')) db.createObjectStore('assessments', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('profiles')) db.createObjectStore('profiles', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });

      /* v1 → v2: everything already recorded belonged to one person. */
      if (event.oldVersion >= 1 && event.oldVersion < 2) {
        const id = uid();
        tx.objectStore('profiles').put({ id, name: 'You', createdAt: new Date().toISOString() });

        for (const name of ['products', 'assessments']) {
          tx.objectStore(name).openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (!cursor) return;
            const value = cursor.value;
            if (!value.profileId) {
              value.profileId = id;
              cursor.update(value);
            }
            cursor.continue();
          };
        }

        const meta = tx.objectStore('meta');
        const existing = meta.get('routine');
        existing.onsuccess = () => {
          if (existing.result) {
            meta.put({ key: routineKey(id), value: existing.result.value });
            meta.delete('routine');
          }
        };
        meta.put({ key: 'activeProfile', value: id });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function request(store, mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
    if (req) {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } else {
      tx.oncomplete = () => resolve();
    }
  }));
}

const uid = () =>
  Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);

const get = (store, key) => request(store, 'readonly', s => s.get(key));
const getAll = store => request(store, 'readonly', s => s.getAll());
const put = (store, value) => request(store, 'readwrite', s => s.put(value));
const del = (store, key) => request(store, 'readwrite', s => s.delete(key));
const clear = store => request(store, 'readwrite', s => s.clear());

/* ---------- meta ---------- */

async function getMeta(key, fallback) {
  const rec = await get('meta', key);
  return rec ? rec.value : fallback;
}

const setMeta = (key, value) => put('meta', { key, value });

function routineKey(profileId) {
  return 'routine:' + profileId;
}

const entryProductId = e => (typeof e === 'string' ? e : e && e.productId);

/* Routines were once a flat list of product ids, one per step. They are now
   {step, productId} entries so a step can hold several products in the order
   they go on. Old lists are matched back onto steps by category — the same rule
   the routine view used to apply when it read them. */
function migrateEntries(entries, period, byId) {
  const kept = [];
  const legacy = [];
  let changed = false;

  for (const e of entries || []) {
    if (typeof e === 'string') { legacy.push(e); changed = true; }
    else if (e && e.productId) {
      // Entries written before the week view applied every day.
      if (!Array.isArray(e.days)) changed = true;
      kept.push({
        step: e.step || null,
        productId: e.productId,
        days: Array.isArray(e.days) ? e.days : [...EVERY_DAY]
      });
    }
  }

  for (const step of stepsFor(period)) {
    const idx = legacy.findIndex(id => byId[id] && step.categories.includes(byId[id].category));
    if (idx > -1) kept.push({ step: step.key, productId: legacy.splice(idx, 1)[0], days: [...EVERY_DAY] });
  }
  // Anything that matched no step still belongs to the person; keep it unplaced.
  for (const id of legacy) if (byId[id]) kept.push({ step: null, productId: id, days: [...EVERY_DAY] });

  return { entries: kept, changed };
}

/* ---------- profiles ---------- */

const getProfiles = async () =>
  (await getAll('profiles')).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));

const getActiveProfileId = () => getMeta('activeProfile', null);
const setActiveProfileId = id => setMeta('activeProfile', id);

const saveProfile = p => put('profiles', p);

async function getActiveProfile() {
  const id = await getActiveProfileId();
  return (await getProfiles()).find(p => p.id === id) || null;
}

async function createProfile(name) {
  const clean = String(name || '').trim();
  if (!clean) throw new Error('A profile needs a name.');
  const existing = await getProfiles();
  if (existing.some(p => p.name.toLowerCase() === clean.toLowerCase())) {
    throw new Error(`There is already a profile called ${clean}.`);
  }
  const profile = { id: uid(), name: clean, createdAt: new Date().toISOString() };
  await put('profiles', profile);
  return profile;
}

async function renameProfile(id, name) {
  const clean = String(name || '').trim();
  if (!clean) throw new Error('A profile needs a name.');
  const profiles = await getProfiles();
  if (profiles.some(p => p.id !== id && p.name.toLowerCase() === clean.toLowerCase())) {
    throw new Error(`There is already a profile called ${clean}.`);
  }
  const profile = profiles.find(p => p.id === id);
  if (!profile) throw new Error('That profile no longer exists.');
  await put('profiles', { ...profile, name: clean });
}

/* Removing a profile takes its shelf, its photographs and its readings with it. */
async function deleteProfile(id) {
  const profiles = await getProfiles();
  if (profiles.length <= 1) throw new Error('At least one profile has to remain.');

  for (const p of (await getAll('products')).filter(x => x.profileId === id)) {
    if (p.imageId) await del('images', p.imageId).catch(() => {});
    await del('products', p.id);
  }
  for (const a of (await getAll('assessments')).filter(x => x.profileId === id)) {
    if (a.photoId) await del('images', a.photoId).catch(() => {});
    await del('assessments', a.id);
  }
  await del('meta', routineKey(id));
  await del('meta', 'chat:' + id);
  await del('meta', 'picks:' + id);
  await del('profiles', id);

  if (await getActiveProfileId() === id) {
    await setActiveProfileId(profiles.find(p => p.id !== id).id);
  }
}

/* Called on every render — guarantees there is always somewhere to put things. */
async function ensureProfile() {
  const profiles = await getProfiles();
  if (!profiles.length) {
    const profile = { id: uid(), name: 'You', createdAt: new Date().toISOString() };
    await put('profiles', profile);
    await setActiveProfileId(profile.id);
    return profile;
  }
  const active = await getActiveProfileId();
  if (!active || !profiles.some(p => p.id === active)) {
    await setActiveProfileId(profiles[0].id);
    return profiles[0];
  }
  return profiles.find(p => p.id === active);
}

/* How much each profile is holding — for the settings list. */
async function profileTallies() {
  const [products, assessments] = await Promise.all([getAll('products'), getAll('assessments')]);
  const tally = {};
  for (const p of products) {
    tally[p.profileId] = tally[p.profileId] || { products: 0, assessments: 0 };
    tally[p.profileId].products++;
  }
  for (const a of assessments) {
    tally[a.profileId] = tally[a.profileId] || { products: 0, assessments: 0 };
    tally[a.profileId].assessments++;
  }
  return tally;
}

/* ---------- products (scoped to the active profile) ---------- */

/* Quantity arrived after the first shelves were built, so every record written
   before it has none. Normalised on the way out rather than by a migration
   pass: an old backup can still be imported, and a product nobody has counted
   yet is one product. */
const withQuantity = p => (p && !Number.isFinite(p.quantity) ? { ...p, quantity: 1 } : p);

async function getProducts() {
  const pid = await getActiveProfileId();
  return (await getAll('products')).filter(p => p.profileId === pid).map(withQuantity);
}

/* Two bottles of the same serum are one record with a count, not two records.
   Matched on brand and name only — size and price are exactly what differs
   between a full-size and a travel one, and those should stay apart. */
const matchKey = (brand, name) =>
  `${(brand || '').trim().toLowerCase().replace(/\s+/g, ' ')}|${(name || '').trim().toLowerCase().replace(/\s+/g, ' ')}`;

async function findProductLike(brand, name) {
  if (!(name || '').trim()) return null;
  const key = matchKey(brand, name);
  return (await getProducts()).find(p => matchKey(p.brand, p.name) === key) || null;
}

/* Clamped at zero, and an emptied product marks itself finished rather than
   disappearing — its ingredients and its history are still referred to by past
   assessments and by the routine. */
async function setQuantity(id, quantity) {
  const p = withQuantity(await getProduct(id));
  if (!p) return null;
  const next = Math.max(0, Math.round(Number(quantity) || 0));
  p.quantity = next;
  if (next === 0 && p.status === 'active') p.status = 'finished';
  if (next > 0 && p.status === 'finished') p.status = 'active';
  p.updatedAt = new Date().toISOString();
  await put('products', p);
  return p;
}

const getProduct = async id => withQuantity(await get('products', id));

async function saveProduct(p) {
  if (!p.profileId) p.profileId = await getActiveProfileId();
  return put('products', p);
}

async function deleteProduct(id) {
  const product = await getProduct(id);
  if (product?.imageId) await del('images', product.imageId).catch(() => {});
  await del('products', id);

  // Drop it from that profile's routine so we never point at a product that is gone.
  if (product) {
    const routine = await getMeta(routineKey(product.profileId), { am: [], pm: [] });
    const am = (routine.am || []).filter(e => entryProductId(e) !== id);
    const pm = (routine.pm || []).filter(e => entryProductId(e) !== id);
    if (am.length !== (routine.am || []).length || pm.length !== (routine.pm || []).length) {
      await setMeta(routineKey(product.profileId), { am, pm });
    }
  }
}

/* One bottle, two people — copy the record rather than sharing it. */
async function copyProductToProfile(productId, targetProfileId) {
  const product = await getProduct(productId);
  if (!product) throw new Error('That product is no longer in the library.');

  const blob = await getImage(product.imageId);
  const copy = {
    ...product,
    id: uid(),
    profileId: targetProfileId,
    imageId: blob ? await putImage(blob) : null,
    // The same bottle on two shelves is still one bottle — carrying the count
    // across would double it.
    quantity: 1,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  await put('products', copy);
  return copy;
}

/* ---------- images ---------- */

async function putImage(blob) {
  const id = uid();
  await put('images', { id, blob });
  return id;
}

async function getImage(id) {
  if (!id) return null;
  const rec = await get('images', id);
  return rec ? rec.blob : null;
}

/* Downscale on the way in — phone photos are far larger than this UI needs. */
function resizeImage(file, maxEdge = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(
        blob => (blob ? resolve(blob) : reject(new Error('Could not encode image.'))),
        'image/jpeg',
        quality
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('That file could not be read as an image.'));
    };
    img.src = url;
  });
}

/* ---------- routine (per profile) ---------- */

async function getRoutine() {
  const pid = await getActiveProfileId();
  const raw = await getMeta(routineKey(pid), { am: [], pm: [] });
  const byId = Object.fromEntries((await getAll('products')).map(p => [p.id, p]));

  const am = migrateEntries(raw.am, 'am', byId);
  const pm = migrateEntries(raw.pm, 'pm', byId);
  const routine = { am: am.entries, pm: pm.entries };

  if (am.changed || pm.changed) await setMeta(routineKey(pid), routine);
  return routine;
}

async function setRoutine(r) {
  return setMeta(routineKey(await getActiveProfileId()), r);
}

const getChat = async () => getMeta('chat:' + (await getActiveProfileId()), []);
const setChat = async v => setMeta('chat:' + (await getActiveProfileId()), v);

const getPicks = async () => getMeta('picks:' + (await getActiveProfileId()), null);
const setPicks = async v => setMeta('picks:' + (await getActiveProfileId()), v);

/* ---------- backup ---------- */

const blobToDataUrl = blob => new Promise((resolve, reject) => {
  const fr = new FileReader();
  fr.onload = () => resolve(fr.result);
  fr.onerror = () => reject(fr.error);
  fr.readAsDataURL(blob);
});

const dataUrlToBlob = url => fetch(url).then(r => r.blob());

/* A backup covers every profile, not just the one you are looking at. */
async function exportAll() {
  const [products, images, assessments, profiles, settings, activeProfile] = await Promise.all([
    getAll('products'), getAll('images'), getAll('assessments'),
    getProfiles(), getSettings(), getActiveProfileId()
  ]);

  const routines = {};
  for (const p of profiles) {
    routines[p.id] = await getMeta(routineKey(p.id), { am: [], pm: [] });
  }

  const encoded = [];
  for (const rec of images) {
    encoded.push({ id: rec.id, dataUrl: await blobToDataUrl(rec.blob) });
  }

  // The API key is deliberately left out of backups.
  return {
    format: 'skincare-library',
    version: 2,
    exportedAt: new Date().toISOString(),
    profiles,
    activeProfile,
    products,
    images: encoded,
    assessments,
    routines,
    settings: { apiKey: '' },
    _keyOmitted: Boolean(settings.apiKey)
  };
}

async function importAll(data, { replace = true } = {}) {
  if (!data || data.format !== 'skincare-library') {
    throw new Error('That file is not a Skincare Library backup.');
  }

  let profiles = data.profiles || [];
  let products = data.products || [];
  let assessments = data.assessments || [];
  let routines = data.routines || {};
  let active = data.activeProfile;

  /* A backup written before profiles existed: everything was one person's. */
  if (!profiles.length) {
    const id = uid();
    profiles = [{ id, name: 'You', createdAt: new Date().toISOString() }];
    products = products.map(p => ({ ...p, profileId: id }));
    assessments = assessments.map(a => ({ ...a, profileId: id }));
    routines = { [id]: data.routine || { am: [], pm: [] } };
    active = id;
  }

  if (replace) {
    await Promise.all([
      clear('products'), clear('images'), clear('assessments'), clear('profiles')
    ]);
    for (const row of await getAll('meta')) {
      if (String(row.key).startsWith('routine:')) await del('meta', row.key);
    }
  }

  for (const rec of data.images || []) {
    await put('images', { id: rec.id, blob: await dataUrlToBlob(rec.dataUrl) });
  }
  for (const p of profiles) await put('profiles', p);
  for (const p of products) await put('products', p);
  for (const a of assessments) await put('assessments', a);
  for (const [id, routine] of Object.entries(routines)) {
    await setMeta(routineKey(id), routine);
  }
  await setActiveProfileId(
    active && profiles.some(p => p.id === active) ? active : profiles[0].id
  );

  return {
    profiles: profiles.length,
    products: products.length,
    assessments: assessments.length
  };
}

async function wipe() {
  await Promise.all(STORES.map(clear));
}

/* ===== js/analysis.js ===== */
/* The assessment engine.

   `assessSkin()` is the only entry point the rest of the app knows about, and
   it always returns the same shape:

     { source, concerns[], routine{am[],pm[]}, gaps[], caveat }

   Two things can fill it. Without a key, `assessFromAnswers()` runs
   deterministic rules over your questionnaire answers and the ingredient tags
   of what you own, and the photograph is never read. With a key, `assessWithAI()`
   in ai.js reads the photograph too — but only if you ticked the box — and adds
   `observations`, `working` and `changes` on top of the same shape.

   If the model call fails, the rules reading is returned with `degraded` set,
   so a bad key or a rate limit costs you detail rather than the whole page. */






/* Built fresh on each call rather than held as a constant, so switching
   language re-labels the questionnaire without a reload. */
const questions = () => [
  {
    key: 'skinType', label: t('q.skinType'), multi: false,
    options: ['dry', 'normal', 'combination', 'oily']
      .map(v => ({ value: v, label: t('q.skinType.' + v) }))
  },
  {
    key: 'sensitivity', label: t('q.sensitivity'), multi: false,
    options: ['low', 'moderate', 'high']
      .map(v => ({ value: v, label: t('q.sensitivity.' + v) }))
  },
  {
    key: 'state', label: t('q.state'), multi: false,
    options: ['settled', 'unsettled', 'irritated']
      .map(v => ({ value: v, label: t('q.state.' + v) }))
  },
  {
    key: 'texture', label: t('q.texture'), multi: false,
    options: ['smooth', 'slight', 'rough']
      .map(v => ({ value: v, label: t('q.texture.' + v) }))
  },
  {
    key: 'sun', label: t('q.sun'), multi: false,
    options: ['minimal', 'moderate', 'high']
      .map(v => ({ value: v, label: t('q.sun.' + v) }))
  },
  {
    key: 'concerns', label: t('q.concerns'), multi: true,
    options: CONCERNS.map(c => ({ value: c.key, label: concernLabel(c) }))
  }
];

const WEIGHT = { marked: 3, moderate: 2, mild: 1 };


/* ---------- reading the answers ---------- */

function readConcerns(answers) {
  const found = new Map();
  const note = (key, severity, evidence) => {
    const existing = found.get(key);
    if (existing && WEIGHT[existing.severity] >= WEIGHT[severity]) return;
    found.set(key, { key, severity, evidence });
  };

  for (const key of answers.concerns || []) {
    note(key, 'marked', t('ev.named'));
  }

  if (answers.skinType === 'dry') {
    note('dryness', 'moderate', t('ev.dryness'));
    note('dehydration', 'mild', t('ev.dehydration'));
  }
  if (answers.skinType === 'oily' || answers.skinType === 'combination') {
    note('oiliness', answers.skinType === 'oily' ? 'moderate' : 'mild', t('ev.oiliness'));
    note('pores', 'mild', t('ev.pores'));
  }
  if (answers.sensitivity === 'high') {
    note('redness', 'moderate', t('ev.redness'));
  }
  if (answers.state === 'irritated') {
    note('barrier', 'marked', t('ev.barrierMarked'));
  } else if (answers.state === 'unsettled') {
    note('barrier', 'mild', t('ev.barrierMild'));
  }
  if (answers.texture === 'rough') {
    note('texture', 'moderate', t('ev.textureRough'));
  } else if (answers.texture === 'slight') {
    note('texture', 'mild', t('ev.textureSlight'));
  }
  if (answers.sun === 'high') {
    note('pigmentation', 'mild', t('ev.sun'));
    note('lines', 'mild', t('ev.sun'));
  }

  return [...found.values()]
    .map(c => ({ ...c, label: concernLabel(c.key) }))
    .sort((a, b) => WEIGHT[b.severity] - WEIGHT[a.severity]);
}

/* ---------- scoring products against those concerns ---------- */

function scoreProduct(product, concerns) {
  const weights = weightedTags(product.ingredients || []);
  let score = 0;
  const reasons = [];

  for (const concern of concerns) {
    const def = concernByKey(concern.key);
    if (!def) continue;
    const sev = WEIGHT[concern.severity];
    for (const tag of def.helps) {
      const w = weights.get(tag);
      if (w) {
        score += sev * w;
        reasons.push({ tag, weight: sev * w });
      }
    }
    for (const tag of def.avoids) {
      const w = weights.get(tag);
      if (w) score -= sev * w * 1.5;
    }
  }
  if (product.status === 'active') score += 0.5;
  if (!product.ingredients?.length) score -= 0.5;

  const top = reasons.sort((a, b) => b.weight - a.weight).slice(0, 2).map(r => r.tag);
  return { score, top };
}

const AM_UNSUITABLE = ['retinoid', 'aha', 'bha'];
const EXFOLIATION_CONCERNS = ['texture', 'dullness', 'blemishes', 'pores', 'pigmentation'];

function buildPeriod(period, products, concerns) {
  const steps = STEPS.filter(s => s.period === period);
  const barrierFirst = concerns.some(c => c.key === 'barrier' && c.severity === 'marked');
  const wantsExfoliation =
    !barrierFirst && concerns.some(c => EXFOLIATION_CONCERNS.includes(c.key));
  const used = new Set();
  const out = [];
  const gaps = [];

  for (const step of steps) {
    if (step.key === 'pm-exfoliate' && !wantsExfoliation) continue;

    let candidates = products.filter(
      p => step.categories.includes(p.category) &&
           p.status !== 'finished' && p.status !== 'retired' &&
           !used.has(p.id)
    );

    // Acids and retinoids belong to the evening.
    if (period === 'am' && step.key !== 'am-cleanse' && step.key !== 'am-protect') {
      candidates = candidates.filter(p => {
        const tags = tagsFor(p.ingredients || []);
        return !AM_UNSUITABLE.some(t => tags.has(t));
      });
    }
    // While the barrier is repairing, leave the exfoliants and retinoids alone.
    if (barrierFirst) {
      candidates = candidates.filter(p => {
        const tags = tagsFor(p.ingredients || []);
        return !['retinoid', 'aha', 'bha'].some(t => tags.has(t));
      });
    }

    if (!candidates.length) {
      if (step.essential) {
        // Phrased without the period so a category missing morning and evening
        // is reported once rather than twice.
        gaps.push({
          category: categoryLabel(step.categories[0]),
          reason: barrierFirst && step.categories[0] !== 'Sunscreen'
            ? t('gap.gentle', { step: stepLabel(step) })
            : t('gap.step', { step: stepLabel(step) })
        });
      }
      continue;
    }

    const ranked = candidates
      .map(p => ({ product: p, ...scoreProduct(p, concerns) }))
      .sort((a, b) => b.score - a.score);

    // A step that holds several products may layer a second one that is
    // actually pulling its weight; every other step takes the best single.
    const picks = step.multiple
      ? ranked.filter((r, i) => i === 0 || r.score > 0).slice(0, 2)
      : ranked.slice(0, 1);

    picks.forEach((pick, i) => {
      used.add(pick.product.id);

      let note;
      if (candidates.length === 1) {
        note = t('note.only', { category: categoryLabel(step.categories[0]) });
      } else if (pick.top.length) {
        note = t('note.chosenFor', { tags: pick.top.map(tagLabel).join(listSep()) });
      } else {
        note = t('note.chosenFrom', { n: ranked.length });
      }
      if (i > 0) note = t('note.layered') + note;

      out.push({ step: stepLabel(step), stepKey: step.key, productId: pick.product.id, note });
    });
  }

  return { steps: out, gaps };
}

/* Concerns the library has nothing at all to offer. */
function libraryGaps(products, concerns) {
  const owned = new Set();
  for (const p of products) {
    if (p.status === 'finished' || p.status === 'retired') continue;
    tagsFor(p.ingredients || []).forEach(t => owned.add(t));
  }
  const gaps = [];
  for (const concern of concerns) {
    if (concern.severity === 'mild') continue;
    const def = concernByKey(concern.key);
    if (!def) continue;
    if (!def.helps.some(t => owned.has(t))) {
      gaps.push({
        category: concernLabel(def),
        reason: t('gap.concern', { tags: def.helps.slice(0, 3).map(tagLabel).join(listSep()) })
      });
    }
  }
  return gaps;
}

function assessFromAnswers({ answers, library }) {
  const concerns = readConcerns(answers || {});
  const products = library || [];

  const am = buildPeriod('am', products, concerns);
  const pm = buildPeriod('pm', products, concerns);

  const seen = new Set();
  const gaps = [...am.gaps, ...pm.gaps, ...libraryGaps(products, concerns)]
    .filter(g => {
      const k = g.category + g.reason;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });

  return {
    source: 'rules',
    concerns,
    routine: { am: am.steps, pm: pm.steps },
    gaps,
    caveat: t('caveat.rules')
  };
}

/* ---------- the single entry point ---------- */

async function assessSkin({ imageBlob, answers, library, routine, sendPhoto } = {}) {
  if (await hasKey()) {
    try {
      return await assessWithAI({ imageBlob, answers, library, routine: routine || { am: [], pm: [] }, sendPhoto });
    } catch (err) {
      // A reading you can act on beats an error page, so fall back to the rules
      // and say plainly that is what happened.
      const fallback = assessFromAnswers({ answers, library });
      fallback.degraded = err.message;
      return fallback;
    }
  }
  return assessFromAnswers({ answers, library });
}


/* ===== js/briefing.js ===== */
/* Export everything the app knows as a Markdown block you can paste into any
   assistant — Gemini, Claude, ChatGPT — alongside a photograph.

   This is the one AI path that needs no key, sends nothing by itself, and shows
   you exactly what you are sharing before you share it. It survives into the
   shared build for the same reason. */







const PREAMBLE = `I'd like help with my skincare. Below is everything I own, the routine I follow, and how my skin has been behaving. I've attached a photograph of my skin.

Please:

1. Describe what you can actually see in the photograph. If the lighting, focus or framing makes something impossible to judge, say so plainly rather than guessing.
2. Tell me which products in my routine are earning their place, and why — referring to specific ingredients.
3. Suggest changes using **only what I already own**, including the order I should apply things.
4. Tell me what my shelf is genuinely missing for the concerns listed below, described by ingredient rather than by brand.

Keep this to cosmetic skincare guidance rather than medical diagnosis, and tell me if anything looks like it needs a doctor rather than a product.`;

const formatDay = iso =>
  new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

const label = tagLabel;

const named = p => `${p.brand ? p.brand + ' · ' : ''}${p.name}`;

/* The questionnaire stores option values; people read option labels. */
function answerLines(answers) {
  if (!answers) return null;
  const lines = [];
  for (const q of questions()) {
    const given = answers[q.key];
    if (!given || (Array.isArray(given) && !given.length)) continue;
    const values = Array.isArray(given) ? given : [given];
    const text = values
      .map(v => q.options.find(o => o.value === v)?.label || v)
      .join(', ');
    lines.push(`- ${q.label} **${text}**`);
  }
  return lines.length ? lines : null;
}

async function buildBriefing() {
  const [profile, products, routine, assessments] = await Promise.all([
    store.getActiveProfile(),
    store.getProducts(),
    store.getRoutine(),
    store.getAssessments()
  ]);

  const byId = Object.fromEntries(products.map(p => [p.id, p]));
  const latest = assessments.sort((a, b) => b.date.localeCompare(a.date))[0];

  const out = [PREAMBLE, '\n---\n'];

  out.push(`# Skincare briefing — ${profile?.name || 'me'}`);
  out.push(`*Exported ${formatDay(new Date().toISOString())}*\n`);

  /* --- how the skin has been --- */
  const answers = answerLines(latest?.answers);
  if (answers) {
    out.push(`## My skin\n\nFrom a self-assessment on ${formatDay(latest.date)}:\n`);
    out.push(answers.join('\n') + '\n');
  } else {
    out.push('## My skin\n\nI have not filled in a self-assessment yet.\n');
  }

  /* --- the shelf --- */
  out.push(`## My shelf — ${products.length} ${products.length === 1 ? 'product' : 'products'}\n`);

  if (!products.length) {
    out.push('Nothing recorded yet.\n');
  } else {
    const ordered = [...products].sort((a, b) =>
      (a.category || '').localeCompare(b.category || '') || named(a).localeCompare(named(b)));

    for (const p of ordered) {
      const actives = activesIn(p.ingredients || []).map(label);
      const flags = flagsIn(p.ingredients || []).map(label);

      out.push(`### ${p.category ? categoryLabel(p.category) : 'Uncategorised'} — ${named(p)}`);
      const facts = [statusLabel(p.status), p.size, p.price].filter(Boolean);
      if (facts.length) out.push(`- ${facts.join(' · ')}`);
      out.push(`- Actives: ${actives.length ? actives.join(', ') : 'none the app recognises'}`);
      if (flags.length) out.push(`- Worth watching: ${flags.join(', ')}`);
      if (p.notes) out.push(`- My notes: ${p.notes.replace(/\s+/g, ' ')}`);
      out.push(`- Ingredients: ${(p.ingredients || []).join(', ') || 'not recorded'}\n`);
    }
  }

  /* --- the routine, in application order --- */
  out.push('## My routine\n');
  let anyStep = false;

  for (const [period, title] of [['am', 'Morning'], ['pm', 'Evening']]) {
    const lines = [];
    for (const step of stepsFor(period)) {
      for (const entry of (routine[period] || []).filter(e => e.step === step.key)) {
        const p = byId[entry.productId];
        if (p) lines.push(`${lines.length + 1}. **${stepLabel(step)}** — ${named(p)}`);
      }
    }
    out.push(`### ${title}\n`);
    out.push(lines.length ? lines.join('\n') + '\n' : '_Nothing recorded._\n');
    if (lines.length) anyStep = true;
  }

  /* --- what the app has already worked out, so the assistant can build on it --- */
  if (anyStep) {
    const notes = [];
    for (const [period, title] of [['am', 'Morning'], ['pm', 'Evening']]) {
      const chosen = (routine[period] || []).map(e => byId[e.productId]).filter(Boolean);
      for (const n of conflictsFor(chosen, period)) notes.push(`- **${title}** — ${n.text}`);
    }
    if (notes.length) {
      out.push('## Layering notes the app already flagged\n');
      out.push(notes.join('\n') + '\n');
    }
  }

  return out.join('\n');
}

/* Clipboard needs a secure context; localhost counts, but fall back anyway. */
async function copyBriefing() {
  const text = await buildBriefing();
  try {
    await navigator.clipboard.writeText(text);
    return { copied: true, text };
  } catch {
    const field = document.createElement('textarea');
    field.value = text;
    field.style.position = 'fixed';
    field.style.opacity = '0';
    document.body.appendChild(field);
    field.select();
    const copied = document.execCommand('copy');
    field.remove();
    return { copied, text };
  }
}

async function downloadBriefing() {
  const text = await buildBriefing();
  const profile = await store.getActiveProfile();
  const slug = (profile?.name || 'briefing').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const blob = new Blob([text], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `skincare-briefing-${slug}-${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Put a control into its waiting state and hand back the undo. */
function waiting(button, label) {

function wireDropzone(zone, onFile) {
  const input = zone.querySelector('input[type="file"]');
  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    if (input.files[0]) onFile(input.files[0]);
  });
  ['dragenter', 'dragover'].forEach(e =>
    zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(e =>
    zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.remove('is-over'); }));
  zone.addEventListener('drop', ev => {
    const file = ev.dataTransfer?.files?.[0];
    if (file) onFile(file);
  });
}

const shelfFilters = { category: '', status: '', active: '' };
/* Emptied products stay in the library but drop out of the default view. One
   click brings them back, and the bar says how many are being kept back — a
   product that silently vanishes when you count the last one out is alarming. */
let showEmptied = false;

async function shelf(root) {
  const products = (await store.getProducts()).sort(byShelfOrder);

  if (!products.length) {
    const who = (await store.getActiveProfile())?.name;
    root.innerHTML = `
      <div class="view-head">${headerArt('shelf')}<h1 class="page-title">${esc(t('shelf.title'))}</h1></div>
      <div class="empty">
        <p>${esc(who ? t('shelf.emptyNamed', { name: who }) : t('shelf.empty'))}</p>
        <a class="btn" href="#/add">${esc(t('shelf.addFirst'))}</a>
      </div>`;
    return;
  }

  const activesPresent = new Set();
  products.forEach(p => tagsFor(p.ingredients || []).forEach(tag => {
    if (ACTIVE_TAGS.includes(tag)) activesPresent.add(tag);
  }));

  const matches = products.filter(p =>
    (!shelfFilters.category || p.category === shelfFilters.category) &&
    (!shelfFilters.status || p.status === shelfFilters.status) &&
    (!shelfFilters.active || tagsFor(p.ingredients || []).has(shelfFilters.active))
  );
  // Asking for Finished explicitly means you want to see them.
  const keepEmptied = showEmptied || shelfFilters.status === 'finished';
  const visible = keepEmptied ? matches : matches.filter(p => p.quantity > 0);
  const emptiedHidden = matches.length - visible.length;

  const onHand = products.reduce((n, p) => n + p.quantity, 0);

  const categoriesPresent = [...new Set(products.map(p => p.category).filter(Boolean))].sort();

  root.innerHTML = `
    <div class="view-head">
      ${headerArt('shelf')}
      <h1 class="page-title">${esc(t('shelf.title'))}</h1>
      <div class="btn-row"><a class="btn" href="#/add">${esc(t('shelf.add'))}</a></div>
    </div>

    <div class="filter-bar">
      <div class="filter">
        <label for="f-cat">${esc(t('shelf.filterCategory'))}</label>
        <select id="f-cat">
          ${option('', t('common.all'), shelfFilters.category)}
          ${categoriesPresent.map(c => option(c, categoryLabel(c), shelfFilters.category)).join('')}
        </select>
      </div>
      <div class="filter">
        <label for="f-status">${esc(t('shelf.filterStatus'))}</label>
        <select id="f-status">
          ${option('', t('common.all'), shelfFilters.status)}
          ${STATUSES.map(s => option(s, statusLabel(s), shelfFilters.status)).join('')}
        </select>
      </div>
      <div class="filter">
        <label for="f-active">${esc(t('shelf.filterContains'))}</label>
        <select id="f-active">
          ${option('', t('common.anything'), shelfFilters.active)}
          ${[...activesPresent].map(x => option(x, tagLabel(x), shelfFilters.active)).join('')}
        </select>
      </div>
      <span class="filter-count">${esc(t('shelf.count', { shown: visible.length, total: products.length }))}
        · ${esc(t('shelf.onHand', { n: onHand }))}</span>
    </div>

    ${emptiedHidden ? `<p class="field-hint" style="margin:-32px 0 32px">
      ${esc(t('shelf.emptiedHidden', { n: emptiedHidden }))}
      <button class="link-btn" id="show-emptied">${esc(t('shelf.showEmptied'))}</button></p>` : ''}
    ${showEmptied && !emptiedHidden ? `<p class="field-hint" style="margin:-32px 0 32px">
      <button class="link-btn" id="hide-emptied">${esc(t('shelf.hideEmptied'))}</button></p>` : ''}

    <div class="shelf" id="shelf-grid"></div>
    ${visible.length ? '' : `<p class="muted">${esc(t('shelf.noMatch'))}</p>`}`;

  const grid = root.querySelector('#shelf-grid');
  for (const p of visible) {
    const blob = await store.getImage(p.imageId);
    const item = document.createElement('div');
    item.className = `shelf-item${p.quantity === 0 ? ' is-empty' : ''}`;
    item.innerHTML = `
      <a class="shelf-link" href="#/product/${esc(p.id)}">
        <div class="shelf-frame">
          ${blob ? `<img src="${imgUrl(blob)}" alt="${esc(p.name)}">` : `<span class="no-image">${esc(t('shelf.noPhoto'))}</span>`}
          ${p.quantity > 1 ? `<span class="shelf-tally">${esc(String(p.quantity))}</span>` : ''}
        </div>
        <div class="shelf-brand">${esc(p.brand || '—')}</div>
        <div class="shelf-name">${esc(p.name)}</div>
        <div class="shelf-meta">${esc(p.category ? categoryLabel(p.category) : '')}${p.status && p.status !== 'active' ? ' · ' + esc(statusLabel(p.status)) : ''}</div>
      </a>
      <div class="stepper">
        <button class="step-btn" data-less="${esc(p.id)}" ${p.quantity === 0 ? 'disabled' : ''}
                aria-label="${esc(t('shelf.oneFewer', { name: p.name }))}">−</button>
        <span class="stepper-count" data-count="${esc(p.id)}">${esc(String(p.quantity))}</span>
        <button class="step-btn" data-more="${esc(p.id)}"
                aria-label="${esc(t('shelf.oneMore', { name: p.name }))}">＋</button>
      </div>`;
    grid.appendChild(item);
  }

  /* Counting up and down happens in place — redrawing the whole shelf would
     lose your scroll position and rebuild every image URL. Only when a product
     empties, or refills, does the card need to change class. */
  const stepBy = async (id, delta) => {
    const before = products.find(x => x.id === id);
    const updated = await store.setQuantity(id, (before?.quantity ?? 1) + delta);
    if (!updated) return;
    if (before) { before.quantity = updated.quantity; before.status = updated.status; }

    const card = root.querySelector(`[data-count="${CSS.escape(id)}"]`)?.closest('.shelf-item');
    if (!card) return;
    card.querySelector(`[data-count="${CSS.escape(id)}"]`).textContent = String(updated.quantity);
    card.querySelector(`[data-less="${CSS.escape(id)}"]`).disabled = updated.quantity === 0;
    card.classList.toggle('is-empty', updated.quantity === 0);

    const frame = card.querySelector('.shelf-frame');
    frame.querySelector('.shelf-tally')?.remove();
    if (updated.quantity > 1) {
      const tally = document.createElement('span');
      tally.className = 'shelf-tally';
      tally.textContent = String(updated.quantity);
      frame.appendChild(tally);
    }
    const meta = card.querySelector('.shelf-meta');
    meta.textContent = `${updated.category ? categoryLabel(updated.category) : ''}`
      + (updated.status && updated.status !== 'active' ? ' · ' + statusLabel(updated.status) : '');
  };

  root.querySelectorAll('[data-less]').forEach(b => { b.onclick = () => stepBy(b.dataset.less, -1); });
  root.querySelectorAll('[data-more]').forEach(b => { b.onclick = () => stepBy(b.dataset.more, +1); });

  const showBtn = root.querySelector('#show-emptied');
  if (showBtn) showBtn.onclick = () => { showEmptied = true; shelf(root); };
  const hideBtn = root.querySelector('#hide-emptied');
  if (hideBtn) hideBtn.onclick = () => { showEmptied = false; shelf(root); };

  root.querySelector('#f-cat').onchange = e => { shelfFilters.category = e.target.value; shelf(root); };
  root.querySelector('#f-status').onchange = e => { shelfFilters.status = e.target.value; shelf(root); };
  root.querySelector('#f-active').onchange = e => { shelfFilters.active = e.target.value; shelf(root); };
}
