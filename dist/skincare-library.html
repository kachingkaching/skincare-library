<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skincare Library</title>
<link rel="icon" href="data:,">
<style>
/* ============================================================
   Skincare Library — art direction after Aesop
   Bone ground, hairline rules, one grotesque, no ornament.
   ============================================================ */

:root {
  --bone:       #F6F3ED;
  --bone-deep:  #EDE8DF;
  --bone-sink:  #E5DFD3;
  --ink:        #1B1A17;
  --ink-muted:  #6E6A60;
  --rule:       #DFD8CB;
  --amber:      #7A5A2E;

  --sans: "Suisse Int'l", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --gutter: 48px;
  --ease: 200ms ease;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bone);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img { max-width: 100%; display: block; }

/* Author styles beat the UA sheet, so [hidden] needs restating. */
[hidden] { display: none !important; }

a { color: inherit; text-decoration: none; }

button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- type ---------- */

.label,
.nav a,
.wordmark,
.btn,
.chip,
.colophon,
.filter-bar label,
.field > label,
th {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.4;
}

h1, h2, h3 { font-weight: 400; margin: 0; }

.page-title {
  font-size: 32px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0;
}

.section-title {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
  margin: 0 0 24px;
}

.muted { color: var(--ink-muted); }

.prose { max-width: 62ch; }

/* ---------- masthead ---------- */

.masthead {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bone);
  border-bottom: 1px solid var(--rule);
}

.masthead-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 22px var(--gutter);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 32px;
}

.wordmark { letter-spacing: 0.22em; }

.mast-left { display: flex; align-items: baseline; gap: 24px; min-width: 0; }

/* Whose shelf you are looking at — always in view, never shouting. */
.profile-switch {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  padding: 2px 0;
  max-width: 170px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  transition: color var(--ease), border-color var(--ease);
}

.profile-switch:hover,
.profile-switch:focus { color: var(--ink); border-bottom-color: var(--ink); outline: none; }

.nav { display: flex; gap: 28px; flex-wrap: wrap; }

.nav a {
  color: var(--ink-muted);
  transition: color var(--ease);
  padding-bottom: 2px;
}

.nav a:hover { color: var(--ink); }

.nav a.is-active {
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
}

/* ---------- shell ---------- */

.view {
  max-width: 1400px;
  margin: 0 auto;
  padding: 64px var(--gutter) 96px;
  min-height: 60vh;
}

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}

.colophon {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px var(--gutter) 48px;
  border-top: 1px solid var(--rule);
  color: var(--ink-muted);
  display: flex;
  justify-content: space-between;
  gap: 24px;
}

/* ---------- controls ---------- */

.btn {
  display: inline-block;
  background: none;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 12px 22px;
  cursor: pointer;
  transition: background var(--ease), color var(--ease), opacity var(--ease);
}

.btn:hover { background: var(--ink); color: var(--bone); }

.btn-quiet {
  border-color: var(--rule);
  color: var(--ink-muted);
}

.btn-quiet:hover { background: none; border-color: var(--ink); color: var(--ink); }

.btn-danger:hover { background: var(--amber); border-color: var(--amber); color: var(--bone); }

.btn:disabled { opacity: 0.35; cursor: default; }
.btn:disabled:hover { background: none; color: var(--ink); }

.btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.field { margin-bottom: 28px; }

.field > label {
  display: block;
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.field input[type="text"],
.field input[type="number"],
.field input[type="date"],
.field input[type="password"],
.field select,
.field textarea {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 8px 0;
  border-radius: 0;
  transition: border-color var(--ease);
  -webkit-appearance: none;
  appearance: none;
}

.field select {
  background-image: none;
  cursor: pointer;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-bottom-color: var(--ink);
}

.field textarea { resize: vertical; min-height: 120px; line-height: 1.7; }

.field-hint { color: var(--ink-muted); font-size: 13px; margin-top: 8px; }

.field-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}

/* radio / checkbox sets */

.choices { display: flex; flex-wrap: wrap; gap: 10px; }

.choices input { position: absolute; opacity: 0; pointer-events: none; }

.choices label {
  border: 1px solid var(--rule);
  padding: 9px 16px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  transition: color var(--ease), border-color var(--ease), background var(--ease);
}

.choices label:hover { color: var(--ink); border-color: var(--ink); }

.choices input:checked + label {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bone);
}

.choices input:focus-visible + label { outline: 1px solid var(--amber); outline-offset: 2px; }

/* ---------- filter bar ---------- */

.filter-bar {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
  align-items: center;
  padding: 16px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 48px;
}

.filter {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.filter label { color: var(--ink-muted); }

.filter select {
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  padding: 2px 0;
  cursor: pointer;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--ease);
}

.filter select:hover, .filter select:focus { border-bottom-color: var(--ink); outline: none; }

.filter-count { margin-left: auto; color: var(--ink-muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

/* ---------- shelf ---------- */

.shelf {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 56px 40px;
}

.shelf-item { display: block; }

.shelf-frame {
  background: var(--bone-deep);
  aspect-ratio: 4 / 5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 18px;
}

.shelf-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity var(--ease);
}

.shelf-item:hover .shelf-frame img { opacity: 0.82; }

.shelf-frame .no-image {
  color: var(--ink-muted);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.shelf-brand {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.shelf-name { font-size: 16px; line-height: 1.4; }

.shelf-meta {
  margin-top: 6px;
  color: var(--ink-muted);
  font-size: 13px;
}

/* ---------- product detail ---------- */

.detail {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: 80px;
  align-items: start;
}

.detail-frame {
  background: var(--bone-deep);
  aspect-ratio: 4 / 5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: sticky;
  top: 110px;
}

.detail-frame img { width: 100%; height: 100%; object-fit: cover; }

.detail-brand {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 12px;
}

.detail-title { font-size: 34px; line-height: 1.15; margin-bottom: 28px; }

.spec {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 0;
  border-top: 1px solid var(--rule);
}

.spec dt {
  padding: 12px 0;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 1px solid var(--rule);
}

.spec dd {
  margin: 0;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
}

.block { margin-top: 56px; }

/* actives summary */

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  border: 1px solid var(--rule);
  padding: 6px 12px;
  color: var(--ink-muted);
}

.chip-active { border-color: var(--amber); color: var(--amber); }
.chip-flag { border-color: var(--amber); color: var(--amber); }

/* ingredient rows */

.ing-list { border-top: 1px solid var(--rule); }

.ing {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 20px;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}

.ing-index { color: var(--ink-muted); font-size: 11px; letter-spacing: 0.08em; }
.ing-name { line-height: 1.4; }
.ing-fn { color: var(--ink-muted); font-size: 13px; line-height: 1.55; }
.ing-unknown .ing-fn { font-style: italic; }
.ing-flagged .ing-name { color: var(--amber); }

.ing-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 1px solid var(--rule);
}

.tag-flag { color: var(--amber); border-bottom-color: var(--amber); }

/* ---------- notices ---------- */

.notice {
  border-left: 1px solid var(--amber);
  padding: 4px 0 4px 20px;
  color: var(--ink-muted);
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 16px;
}

.notice strong { color: var(--amber); font-weight: 400; }

.caveat {
  border: 1px solid var(--rule);
  padding: 20px 24px;
  color: var(--ink-muted);
  font-size: 13px;
  line-height: 1.65;
  margin-bottom: 48px;
}

/* ---------- empty state ---------- */

.empty {
  border-top: 1px solid var(--rule);
  padding-top: 48px;
  max-width: 46ch;
}

.empty p { color: var(--ink-muted); margin: 0 0 24px; }

/* ---------- upload ---------- */

.dropzone {
  background: var(--bone-deep);
  border: 1px solid var(--rule);
  aspect-ratio: 4 / 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  cursor: pointer;
  text-align: center;
  padding: 24px;
  transition: border-color var(--ease), background var(--ease);
  position: relative;
  overflow: hidden;
}

.dropzone:hover, .dropzone.is-over { border-color: var(--ink); }

.dropzone p {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.dropzone img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.dropzone input[type="file"] { display: none; }

.form-grid {
  display: grid;
  grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
  gap: 80px;
  align-items: start;
}

/* ---------- assessment ---------- */

.assess-grid {
  display: grid;
  grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
  gap: 80px;
  align-items: start;
}

.reading { border-top: 1px solid var(--rule); }

.reading-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1.4fr);
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}

.severity {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.severity-marked { color: var(--amber); }

.reading-note { color: var(--ink-muted); font-size: 13px; }

.routine-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
}

.step {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 20px;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}

.step-num { color: var(--ink-muted); font-size: 11px; letter-spacing: 0.08em; }
.step-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
.step-product { line-height: 1.4; }
.step-empty { color: var(--ink-muted); font-style: italic; }
.step-note { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }

.history { border-top: 1px solid var(--rule); }

.history-row {
  display: flex;
  gap: 24px;
  align-items: baseline;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  width: 100%;
  text-align: left;
  background: none;
  border-left: none;
  border-right: none;
  border-top: none;
  cursor: pointer;
  transition: opacity var(--ease);
}

.history-row:hover { opacity: 0.6; }
.history-date { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); min-width: 140px; }

/* ---------- routine builder ---------- */

.picker { border-top: 1px solid var(--rule); }

.picker-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
}

.picker-row .grow { flex: 1; min-width: 0; }
.picker-row .picker-step { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }

.link-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  color: var(--ink-muted);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transition: color var(--ease);
}

.link-btn:hover { color: var(--ink); }

/* Profile names are edited in place; the rule appears on approach. */
.profile-name {
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid transparent;
  border-radius: 0;
  padding: 4px 0;
  transition: border-color var(--ease);
}

.profile-name:hover { border-bottom-color: var(--rule); }
.profile-name:focus { border-bottom-color: var(--ink); outline: none; }

/* ---------- waiting ---------- */

/* Three dots, for anything that has gone away to think. Sized off the text it
   sits in, so it works inside a button and inside a sentence. */
.dots {
  display: inline-flex;
  align-items: center;
  gap: 0.32em;
  vertical-align: baseline;
  margin-left: 0.15em;
}

.dots i {
  width: 0.28em;
  height: 0.28em;
  min-width: 3px;
  min-height: 3px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.25;
  animation: dot-drift 1.25s infinite ease-in-out;
}

.dots i:nth-child(2) { animation-delay: 0.16s; }
.dots i:nth-child(3) { animation-delay: 0.32s; }

@keyframes dot-drift {
  0%, 65%, 100% { opacity: 0.25; transform: translateY(0); }
  32%           { opacity: 1;    transform: translateY(-0.18em); }
}

@media (prefers-reduced-motion: reduce) {
  .dots i { animation: none; opacity: 0.55; }
}

/* ---------- chat ---------- */

.chat-launch {
  position: fixed;
  right: var(--gutter);
  bottom: 28px;
  z-index: 40;
  background: var(--ink);
  color: var(--bone);
  border: none;
  border-radius: 0;
  padding: 14px 26px;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity var(--ease);
}

.chat-launch:hover { opacity: 0.82; }

.chat-panel {
  position: fixed;
  right: var(--gutter);
  bottom: 28px;
  z-index: 41;
  width: 380px;
  max-width: calc(100vw - var(--gutter) * 2);
  height: 520px;
  max-height: calc(100vh - 120px);
  background: var(--bone);
  border: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
}

.chat-head {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule);
}

.chat-log {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.chat-turn { margin-bottom: 20px; }

.chat-who {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 6px;
}

.chat-user .chat-who { color: var(--amber); }

.chat-text { font-size: 14px; line-height: 1.6; }

.chat-form {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 16px 20px;
  border-top: 1px solid var(--rule);
}

.chat-form input {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  padding: 6px 0;
  transition: border-color var(--ease);
}

.chat-form input:focus { outline: none; border-bottom-color: var(--ink); }
.chat-form .btn { padding: 9px 16px; }

/* ---------- discoveries ---------- */

.picks { border-top: 1px solid var(--rule); }

.pick {
  padding: 24px 0;
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
  gap: 32px;
  align-items: start;
}

.pick-brand {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.pick-name { font-size: 17px; line-height: 1.35; }
.pick-kind { color: var(--ink-muted); font-size: 13px; margin-top: 4px; }
.pick-why { line-height: 1.6; }
.pick-meta { color: var(--ink-muted); font-size: 13px; margin-top: 10px; }

/* ---------- responsive ---------- */

@media (max-width: 1080px) {
  :root { --gutter: 32px; }
  .shelf { grid-template-columns: repeat(2, 1fr); gap: 48px 32px; }
  .detail, .form-grid, .assess-grid { grid-template-columns: 1fr; gap: 48px; }
  .detail-frame { position: static; max-width: 480px; }
  .routine-cols { gap: 48px; }
}

@media (max-width: 720px) {
  :root { --gutter: 20px; }
  body { font-size: 14px; }
  .view { padding: 40px var(--gutter) 64px; }
  .masthead-inner { flex-direction: column; align-items: flex-start; gap: 16px; padding: 18px var(--gutter); }
  .mast-left { gap: 14px; }
  .profile-switch { max-width: 120px; }
  .nav { gap: 18px; }
  .shelf { grid-template-columns: 1fr; gap: 40px; }
  .page-title { font-size: 26px; }
  .detail-title { font-size: 26px; }
  .field-pair { grid-template-columns: 1fr; gap: 0; }
  .routine-cols { grid-template-columns: 1fr; }
  .spec { grid-template-columns: 110px 1fr; }
  .ing { grid-template-columns: 22px 1fr; }
  .ing-fn { grid-column: 2; }
  .reading-row { grid-template-columns: 1fr; gap: 4px; }
  .filter-bar { gap: 20px; }
  .colophon { flex-direction: column; gap: 8px; }
  .pick { grid-template-columns: 1fr; gap: 12px; }
  .chat-panel { left: var(--gutter); right: var(--gutter); width: auto; height: 70vh; }
  .chat-launch { right: var(--gutter); bottom: 20px; }
}

</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="mast-left">
      <a class="wordmark" href="#/">Skincare&nbsp;Library</a>
      <select class="profile-switch" id="profile-select" aria-label="Whose shelf"></select>
    </div>
    <nav class="nav" id="nav">
      <a href="#/" data-route="shelf">Shelf</a>
      <a href="#/add" data-route="add">Add</a>
      <a href="#/assess" data-route="assess">Assessment</a>
      <a href="#/routine" data-route="routine">Routine</a>
      <a href="#/discoveries" data-route="discoveries">Discoveries</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
  </div>
</header>

<main id="view" class="view"></main>

<footer class="colophon">
  <span>Kept privately in this browser.</span>
  <span id="colophon-count"></span>
</footer>

<script>
(() => {
"use strict";
/* ===== js/ingredients.js ===== */

/* Lowercase, strip the decoration ingredient lists collect. */
function normalize(raw) {
  return String(raw)
    .toLowerCase()
    .replace(/\[[^\]]*\]/g, ' ')
    .replace(/\*+/g, ' ')
    .replace(/[.,;:•]+\s*$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

const stripParens = s => s.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();

/* Resolve one ingredient name to a dictionary entry, or null. */
function lookup(raw) {
  const forms = [];
  const base = normalize(raw);
  forms.push(base);
  const bare = stripParens(base);
  if (bare !== base) forms.push(bare);
  // "Butyrospermum Parkii (Shea) Butter" -> "butyrospermum parkii butter"
  const collapsed = base.replace(/\(([^)]*)\)/g, ' ').replace(/\s+/g, ' ').trim();
  if (!forms.includes(collapsed)) forms.push(collapsed);

  for (const form of forms) {
    if (ALIASES[form] && INGREDIENTS[ALIASES[form]]) return INGREDIENTS[ALIASES[form]];
    if (INGREDIENTS[form]) return INGREDIENTS[form];
  }
  return null;
}

/* Turn a pasted INCI list into an array of trimmed names. */
function parseIngredients(text) {
  if (!text) return [];
  return String(text)
    .replace(/^\s*ingredients?\s*[:\-]\s*/i, '')
    .replace(/\(and\)/gi, ',')
    .split(/[,\n;•]+/)
    .map(s => s.replace(/^\s*\d+[).]\s*/, '').replace(/\s+/g, ' ').trim())
    .map(s => s.replace(/[.\s]+$/, ''))
    .filter(Boolean);
}

/* Every tag present in a product's ingredient list. */
function tagsFor(ingredients = []) {
  const set = new Set();
  for (const name of ingredients) {
    const entry = lookup(name);
    if (entry) entry.t.forEach(t => set.add(t));
  }
  return set;
}

/* Weight by position: what appears early is present in quantity. */
function weightedTags(ingredients = []) {
  const weights = new Map();
  const n = ingredients.length || 1;
  ingredients.forEach((name, i) => {
    const entry = lookup(name);
    if (!entry) return;
    const pos = i / n;
    const w = pos < 0.34 ? 1 : pos < 0.67 ? 0.6 : 0.3;
    for (const tag of entry.t) {
      weights.set(tag, Math.max(weights.get(tag) || 0, w));
    }
  });
  return weights;
}

const activesIn = ingredients =>
  ACTIVE_TAGS.filter(t => tagsFor(ingredients).has(t));

const flagsIn = ingredients =>
  FLAG_TAGS.filter(t => tagsFor(ingredients).has(t));

/* `products` are the product objects placed in one period of a routine. */
function conflictsFor(products, period) {
  const notes = [];
  const withTag = tag => products.filter(p => productTags(p).has(tag));

  const retinoids = withTag('retinoid');
  const ahas = withTag('aha').filter(p => p.category !== 'Sunscreen');
  const bhas = withTag('bha');
  const filters = withTag('uv-filter');
  const acids = [...new Set([...ahas, ...bhas])];

  if (retinoids.length && acids.length) {
    notes.push({
      severity: 'high',
      text: `${retinoids[0].name} and ${acids[0].name} in one routine is a common cause of irritation. Alternate them on different evenings rather than layering.`
    });
  }
  if (ahas.length && bhas.length) {
    notes.push({
      severity: 'medium',
      text: 'An AHA and a BHA together is a lot of exfoliation for one sitting. Consider keeping one of them for a separate night.'
    });
  }
  if (retinoids.length > 1) {
    notes.push({ severity: 'medium', text: 'Two retinoids in the same routine gives no extra benefit, only extra irritation.' });
  }
  if (period === 'am' && (retinoids.length || acids.length)) {
    notes.push({
      severity: 'medium',
      text: 'Retinoids and acids leave skin more sun-sensitive. They sit more comfortably in the evening.'
    });
  }
  if (period === 'am' && !filters.length && products.length) {
    notes.push({ severity: 'high', text: 'No sunscreen in the morning routine. Everything else you do for tone and lines depends on it.' });
  }
  const bp = products.filter(p => hasIngredient(p, 'benzoyl peroxide'));
  if (bp.length && retinoids.length) {
    notes.push({ severity: 'medium', text: 'Benzoyl peroxide can degrade a retinoid applied at the same time. Use them at opposite ends of the day.' });
  }
  const vitc = withTag('vitamin-c');
  if (vitc.length && retinoids.length) {
    notes.push({ severity: 'low', text: 'Vitamin C and a retinoid together is tolerable but busy. Vitamin C in the morning, retinoid at night, is the easier split.' });
  }
  const fragranced = withTag('fragrance').concat(withTag('essential-oil'));
  if (new Set(fragranced).size >= 3) {
    notes.push({ severity: 'low', text: 'Three or more fragranced products in one routine. Worth thinning out if your skin ever runs reactive.' });
  }
  return notes;
}


/* ===== js/store.js ===== */
/* IndexedDB wrapper. Everything the app persists goes through here.

   Products, assessments and routines belong to a profile, so the whole family
   can share one browser. Reads are scoped to whichever profile is active — the
   views mostly don't need to know profiles exist. Photographs and the API key
   are the exceptions: images are referenced by id, and the key is a property of
   the machine rather than of a person. */



const DB_NAME = 'skincare';
const DB_VERSION = 2;
const STORES = ['products', 'images', 'assessments', 'profiles', 'meta'];

let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = event => {
      const db = req.result;
      const tx = req.transaction;

      if (!db.objectStoreNames.contains('products')) db.createObjectStore('products', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('assessments')) db.createObjectStore('assessments', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('profiles')) db.createObjectStore('profiles', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });

      /* v1 → v2: everything already recorded belonged to one person. */
      if (event.oldVersion >= 1 && event.oldVersion < 2) {
        const id = uid();
        tx.objectStore('profiles').put({ id, name: 'You', createdAt: new Date().toISOString() });

        for (const name of ['products', 'assessments']) {
          tx.objectStore(name).openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (!cursor) return;
            const value = cursor.value;
            if (!value.profileId) {
              value.profileId = id;
              cursor.update(value);
            }
            cursor.continue();
          };
        }

        const meta = tx.objectStore('meta');
        const existing = meta.get('routine');
        existing.onsuccess = () => {
          if (existing.result) {
            meta.put({ key: routineKey(id), value: existing.result.value });
            meta.delete('routine');
          }
        };
        meta.put({ key: 'activeProfile', value: id });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function request(store, mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
    if (req) {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } else {
      tx.oncomplete = () => resolve();
    }
  }));
}

const uid = () =>
  Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);

const get = (store, key) => request(store, 'readonly', s => s.get(key));
const getAll = store => request(store, 'readonly', s => s.getAll());
const put = (store, value) => request(store, 'readwrite', s => s.put(value));
const del = (store, key) => request(store, 'readwrite', s => s.delete(key));
const clear = store => request(store, 'readwrite', s => s.clear());

/* ---------- meta ---------- */

async function getMeta(key, fallback) {
  const rec = await get('meta', key);
  return rec ? rec.value : fallback;
}

const setMeta = (key, value) => put('meta', { key, value });

function routineKey(profileId) {
  return 'routine:' + profileId;
}

const entryProductId = e => (typeof e === 'string' ? e : e && e.productId);

/* Routines were once a flat list of product ids, one per step. They are now
   {step, productId} entries so a step can hold several products in the order
   they go on. Old lists are matched back onto steps by category — the same rule
   the routine view used to apply when it read them. */
function migrateEntries(entries, period, byId) {
  const kept = [];
  const legacy = [];
  let changed = false;

  for (const e of entries || []) {
    if (typeof e === 'string') { legacy.push(e); changed = true; }
    else if (e && e.productId) kept.push({ step: e.step || null, productId: e.productId });
  }

  for (const step of stepsFor(period)) {
    const idx = legacy.findIndex(id => byId[id] && step.categories.includes(byId[id].category));
    if (idx > -1) kept.push({ step: step.key, productId: legacy.splice(idx, 1)[0] });
  }
  // Anything that matched no step still belongs to the person; keep it unplaced.
  for (const id of legacy) if (byId[id]) kept.push({ step: null, productId: id });

  return { entries: kept, changed };
}

/* ---------- profiles ---------- */

const getProfiles = async () =>
  (await getAll('profiles')).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));

const getActiveProfileId = () => getMeta('activeProfile', null);
const setActiveProfileId = id => setMeta('activeProfile', id);

const saveProfile = p => put('profiles', p);

async function getActiveProfile() {
  const id = await getActiveProfileId();
  return (await getProfiles()).find(p => p.id === id) || null;
}

async function createProfile(name) {
  const clean = String(name || '').trim();
  if (!clean) throw new Error('A profile needs a name.');
  const existing = await getProfiles();
  if (existing.some(p => p.name.toLowerCase() === clean.toLowerCase())) {
    throw new Error(`There is already a profile called ${clean}.`);
  }
  const profile = { id: uid(), name: clean, createdAt: new Date().toISOString() };
  await put('profiles', profile);
  return profile;
}

async function renameProfile(id, name) {
  const clean = String(name || '').trim();
  if (!clean) throw new Error('A profile needs a name.');
  const profiles = await getProfiles();
  if (profiles.some(p => p.id !== id && p.name.toLowerCase() === clean.toLowerCase())) {
    throw new Error(`There is already a profile called ${clean}.`);
  }
  const profile = profiles.find(p => p.id === id);
  if (!profile) throw new Error('That profile no longer exists.');
  await put('profiles', { ...profile, name: clean });
}

/* Removing a profile takes its shelf, its photographs and its readings with it. */
async function deleteProfile(id) {
  const profiles = await getProfiles();
  if (profiles.length <= 1) throw new Error('At least one profile has to remain.');

  for (const p of (await getAll('products')).filter(x => x.profileId === id)) {
    if (p.imageId) await del('images', p.imageId).catch(() => {});
    await del('products', p.id);
  }
  for (const a of (await getAll('assessments')).filter(x => x.profileId === id)) {
    if (a.photoId) await del('images', a.photoId).catch(() => {});
    await del('assessments', a.id);

/* Downscale on the way in — phone photos are far larger than this UI needs. */
function resizeImage(file, maxEdge = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(
        blob => (blob ? resolve(blob) : reject(new Error('Could not encode image.'))),
        'image/jpeg',
        quality
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('That file could not be read as an image.'));
    };
    img.src = url;
  });
}

/* ===== js/analysis.js ===== */
/* The assessment engine.

   `assessSkin()` is the only entry point the rest of the app knows about, and
   it always returns the same shape:

     { source, concerns[], routine{am[],pm[]}, gaps[], caveat }

   Two things can fill it. Without a key, `assessFromAnswers()` runs
   deterministic rules over your questionnaire answers and the ingredient tags
   of what you own, and the photograph is never read. With a key, `assessWithAI()`
   in ai.js reads the photograph too — but only if you ticked the box — and adds
   `observations`, `working` and `changes` on top of the same shape.

   If the model call fails, the rules reading is returned with `degraded` set,
   so a bad key or a rate limit costs you detail rather than the whole page. */





const QUESTIONS = [
  {
    key: 'skinType', label: 'How does your skin behave by mid-afternoon?', multi: false,
    options: [
      { value: 'dry', label: 'Tight, flaking' },
      { value: 'normal', label: 'Comfortable' },
      { value: 'combination', label: 'Shine in the centre' },
      { value: 'oily', label: 'Shine throughout' }
    ]
  },
  {
    key: 'sensitivity', label: 'How readily does it react to something new?', multi: false,
    options: [
      { value: 'low', label: 'Rarely' },
      { value: 'moderate', label: 'Sometimes' },
      { value: 'high', label: 'Often' }
    ]
  },
  {
    key: 'state', label: 'How is it at this moment?', multi: false,
    options: [
      { value: 'settled', label: 'Settled' },
      { value: 'unsettled', label: 'Unsettled' },
      { value: 'irritated', label: 'Irritated or stinging' }
    ]
  },
  {
    key: 'texture', label: 'How does the surface feel to the hand?', multi: false,
    options: [
      { value: 'smooth', label: 'Smooth' },
      { value: 'slight', label: 'Slightly uneven' },
      { value: 'rough', label: 'Rough or bumpy' }
    ]
  },
  {
    key: 'sun', label: 'How much daylight do you take on?', multi: false,
    options: [
      { value: 'minimal', label: 'Little' },
      { value: 'moderate', label: 'Moderate' },
      { value: 'high', label: 'A great deal' }
    ]
  },
  {
    key: 'concerns', label: 'What would you most like to change?', multi: true,
    options: CONCERNS.map(c => ({ value: c.key, label: c.label }))
  }
];

const WEIGHT = { marked: 3, moderate: 2, mild: 1 };
const SEVERITY_LABEL = { marked: 'Marked', moderate: 'Moderate', mild: 'Mild' };

/* ---------- reading the answers ---------- */

function readConcerns(answers) {
  const found = new Map();
  const note = (key, severity, evidence) => {
    const existing = found.get(key);
    if (existing && WEIGHT[existing.severity] >= WEIGHT[severity]) return;
    found.set(key, { key, severity, evidence });
  };

  for (const key of answers.concerns || []) {
    note(key, 'marked', 'You named this directly.');
  }

  if (answers.skinType === 'dry') {
    note('dryness', 'moderate', 'Skin reads tight and flaking by mid-afternoon.');
    note('dehydration', 'mild', 'Tightness usually means water loss as much as oil loss.');
  }
  if (answers.skinType === 'oily' || answers.skinType === 'combination') {
    note('oiliness', answers.skinType === 'oily' ? 'moderate' : 'mild', 'Shine returns through the day.');
    note('pores', 'mild', 'Oilier skin tends to show pores more plainly.');
  }
  if (answers.sensitivity === 'high') {
    note('redness', 'moderate', 'Skin reacts often to new products.');
  }
  if (answers.state === 'irritated') {
    note('barrier', 'marked', 'Skin is currently irritated — the barrier comes first.');
  } else if (answers.state === 'unsettled') {
    note('barrier', 'mild', 'Skin is unsettled at present.');
  }
  if (answers.texture === 'rough') {
    note('texture', 'moderate', 'The surface feels rough to the hand.');
  } else if (answers.texture === 'slight') {
    note('texture', 'mild', 'The surface feels slightly uneven.');
  }
  if (answers.sun === 'high') {
    note('pigmentation', 'mild', 'Considerable daylight exposure.');
    note('lines', 'mild', 'Considerable daylight exposure.');
  }

  return [...found.values()]
    .map(c => ({ ...c, label: concernByKey(c.key)?.label || c.key }))
    .sort((a, b) => WEIGHT[b.severity] - WEIGHT[a.severity]);
}

/* ---------- scoring products against those concerns ---------- */

function scoreProduct(product, concerns) {
  const weights = weightedTags(product.ingredients || []);
  let score = 0;
  const reasons = [];

  for (const concern of concerns) {
    const def = concernByKey(concern.key);
    if (!def) continue;
    const sev = WEIGHT[concern.severity];
    for (const tag of def.helps) {
      const w = weights.get(tag);
      if (w) {
        score += sev * w;
        reasons.push({ tag, weight: sev * w });
      }
    }
    for (const tag of def.avoids) {
      const w = weights.get(tag);
      if (w) score -= sev * w * 1.5;
    }
  }
  if (product.status === 'active') score += 0.5;
  if (!product.ingredients?.length) score -= 0.5;

  const top = reasons.sort((a, b) => b.weight - a.weight).slice(0, 2).map(r => r.tag);
  return { score, top };
}

const AM_UNSUITABLE = ['retinoid', 'aha', 'bha'];
const EXFOLIATION_CONCERNS = ['texture', 'dullness', 'blemishes', 'pores', 'pigmentation'];

function buildPeriod(period, products, concerns) {
  const steps = STEPS.filter(s => s.period === period);
  const barrierFirst = concerns.some(c => c.key === 'barrier' && c.severity === 'marked');
  const wantsExfoliation =
    !barrierFirst && concerns.some(c => EXFOLIATION_CONCERNS.includes(c.key));
  const used = new Set();
  const out = [];
  const gaps = [];

  for (const step of steps) {
    if (step.key === 'pm-exfoliate' && !wantsExfoliation) continue;

    let candidates = products.filter(
      p => step.categories.includes(p.category) &&
           p.status !== 'finished' && p.status !== 'retired' &&
           !used.has(p.id)
    );

    // Acids and retinoids belong to the evening.
    if (period === 'am' && step.key !== 'am-cleanse' && step.key !== 'am-protect') {
      candidates = candidates.filter(p => {
        const tags = tagsFor(p.ingredients || []);
        return !AM_UNSUITABLE.some(t => tags.has(t));
      });
    }
    // While the barrier is repairing, leave the exfoliants and retinoids alone.
    if (barrierFirst) {
      candidates = candidates.filter(p => {
        const tags = tagsFor(p.ingredients || []);
        return !['retinoid', 'aha', 'bha'].some(t => tags.has(t));
      });
    }

    if (!candidates.length) {
      if (step.essential) {
        // Phrased without the period so a category missing morning and evening
        // is reported once rather than twice.
        gaps.push({
          category: step.categories[0],
          reason: barrierFirst && step.categories[0] !== 'Sunscreen'
            ? `Nothing on this shelf fills the ${step.label.toLowerCase()} step gently enough for skin in this state.`
            : `Nothing on this shelf covers the ${step.label.toLowerCase()} step.`
        });
      }
      continue;
    }

    const ranked = candidates
      .map(p => ({ product: p, ...scoreProduct(p, concerns) }))
      .sort((a, b) => b.score - a.score);

    // A step that holds several products may layer a second one that is
    // actually pulling its weight; every other step takes the best single.
    const picks = step.multiple
      ? ranked.filter((r, i) => i === 0 || r.score > 0).slice(0, 2)
      : ranked.slice(0, 1);

    picks.forEach((pick, i) => {
      used.add(pick.product.id);

      let note;
      if (candidates.length === 1) {
        note = `The only ${step.categories[0].toLowerCase()} on the shelf.`;
      } else if (pick.top.length) {
        note = `Chosen for its ${pick.top.join(' and ')}.`;
      } else {
        note = `Chosen from ${ranked.length} in the same category.`;
      }
      if (i > 0) note = `Layered after the first. ${note}`;

      out.push({ step: step.label, stepKey: step.key, productId: pick.product.id, note });
    });
  }

  return { steps: out, gaps };
}

/* Concerns the library has nothing at all to offer. */
function libraryGaps(products, concerns) {
  const owned = new Set();
  for (const p of products) {
    if (p.status === 'finished' || p.status === 'retired') continue;
    tagsFor(p.ingredients || []).forEach(t => owned.add(t));
  }
  const gaps = [];
  for (const concern of concerns) {
    if (concern.severity === 'mild') continue;
    const def = concernByKey(concern.key);
    if (!def) continue;
    if (!def.helps.some(t => owned.has(t))) {
      gaps.push({
        category: def.label,
        reason: `Nothing on this shelf carries the ingredients that usually address this — look for ${def.helps.slice(0, 3).join(', ')}.`
      });
    }
  }
  return gaps;
}

function assessFromAnswers({ answers, library }) {
  const concerns = readConcerns(answers || {});
  const products = library || [];

  const am = buildPeriod('am', products, concerns);
  const pm = buildPeriod('pm', products, concerns);

  const seen = new Set();
  const gaps = [...am.gaps, ...pm.gaps, ...libraryGaps(products, concerns)]
    .filter(g => {
      const k = g.category + g.reason;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });

  return {
    source: 'rules',
    concerns,
    routine: { am: am.steps, pm: pm.steps },
    gaps,
    caveat:
      'This reading is derived from your answers and the ingredient lists of the products you own — the photograph is stored for your own comparison over time, not analysed. It is a considered starting point, not a dermatological opinion.'
  };
}

/* ---------- the single entry point ---------- */

async function assessSkin({ imageBlob, answers, library, routine, sendPhoto } = {}) {
  if (await hasKey()) {
    try {
      return await assessWithAI({ imageBlob, answers, library, routine: routine || { am: [], pm: [] }, sendPhoto });
    } catch (err) {
      // A reading you can act on beats an error page, so fall back to the rules
      // and say plainly that is what happened.
      const fallback = assessFromAnswers({ answers, library });
      fallback.degraded = err.message;
      return fallback;
    }
  }
  return assessFromAnswers({ answers, library });
}


/* ===== js/briefing.js ===== */
/* Export everything the app knows as a Markdown block you can paste into any
   assistant — Gemini, Claude, ChatGPT — alongside a photograph.

   This is the one AI path that needs no key, sends nothing by itself, and shows
   you exactly what you are sharing before you share it. It survives into the
   shared build for the same reason. */






const PREAMBLE = `I'd like help with my skincare. Below is everything I own, the routine I follow, and how my skin has been behaving. I've attached a photograph of my skin.

Please:

1. Describe what you can actually see in the photograph. If the lighting, focus or framing makes something impossible to judge, say so plainly rather than guessing.
2. Tell me which products in my routine are earning their place, and why — referring to specific ingredients.
3. Suggest changes using **only what I already own**, including the order I should apply things.
4. Tell me what my shelf is genuinely missing for the concerns listed below, described by ingredient rather than by brand.

Keep this to cosmetic skincare guidance rather than medical diagnosis, and tell me if anything looks like it needs a doctor rather than a product.`;

const formatDay = iso =>
  new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

const label = tag => TAG_LABEL[tag] || tag;

const named = p => `${p.brand ? p.brand + ' · ' : ''}${p.name}`;

/* The questionnaire stores option values; people read option labels. */
function answerLines(answers) {
  if (!answers) return null;
  const lines = [];
  for (const q of QUESTIONS) {
    const given = answers[q.key];
    if (!given || (Array.isArray(given) && !given.length)) continue;
    const values = Array.isArray(given) ? given : [given];
    const text = values
      .map(v => q.options.find(o => o.value === v)?.label || v)
      .join(', ');
    lines.push(`- ${q.label} **${text}**`);
  }
  return lines.length ? lines : null;
}

async function buildBriefing() {
  const [profile, products, routine, assessments] = await Promise.all([
    store.getActiveProfile(),
    store.getProducts(),
    store.getRoutine(),
    store.getAssessments()
  ]);

  const byId = Object.fromEntries(products.map(p => [p.id, p]));
  const latest = assessments.sort((a, b) => b.date.localeCompare(a.date))[0];

  const out = [PREAMBLE, '\n---\n'];

  out.push(`# Skincare briefing — ${profile?.name || 'me'}`);
  out.push(`*Exported ${formatDay(new Date().toISOString())}*\n`);

  /* --- how the skin has been --- */
  const answers = answerLines(latest?.answers);
  if (answers) {
    out.push(`## My skin\n\nFrom a self-assessment on ${formatDay(latest.date)}:\n`);
    out.push(answers.join('\n') + '\n');
  } else {
    out.push('## My skin\n\nI have not filled in a self-assessment yet.\n');
  }

  /* --- the shelf --- */
  out.push(`## My shelf — ${products.length} ${products.length === 1 ? 'product' : 'products'}\n`);

  if (!products.length) {
    out.push('Nothing recorded yet.\n');
  } else {
    const ordered = [...products].sort((a, b) =>
      (a.category || '').localeCompare(b.category || '') || named(a).localeCompare(named(b)));

    for (const p of ordered) {
      const actives = activesIn(p.ingredients || []).map(label);
      const flags = flagsIn(p.ingredients || []).map(label);

      out.push(`### ${p.category || 'Uncategorised'} — ${named(p)}`);
      const facts = [STATUS_LABEL[p.status] || p.status, p.size, p.price].filter(Boolean);
      if (facts.length) out.push(`- ${facts.join(' · ')}`);
      out.push(`- Actives: ${actives.length ? actives.join(', ') : 'none the app recognises'}`);
      if (flags.length) out.push(`- Worth watching: ${flags.join(', ')}`);
      if (p.notes) out.push(`- My notes: ${p.notes.replace(/\s+/g, ' ')}`);
      out.push(`- Ingredients: ${(p.ingredients || []).join(', ') || 'not recorded'}\n`);
    }
  }

  /* --- the routine, in application order --- */
  out.push('## My routine\n');
  let anyStep = false;

  for (const [period, title] of [['am', 'Morning'], ['pm', 'Evening']]) {
    const lines = [];
    for (const step of stepsFor(period)) {
      for (const entry of (routine[period] || []).filter(e => e.step === step.key)) {
        const p = byId[entry.productId];
        if (p) lines.push(`${lines.length + 1}. **${step.label}** — ${named(p)}`);
      }
    }
    out.push(`### ${title}\n`);
    out.push(lines.length ? lines.join('\n') + '\n' : '_Nothing recorded._\n');
    if (lines.length) anyStep = true;
  }

  /* --- what the app has already worked out, so the assistant can build on it --- */
  if (anyStep) {
    const notes = [];
    for (const [period, title] of [['am', 'Morning'], ['pm', 'Evening']]) {
      const chosen = (routine[period] || []).map(e => byId[e.productId]).filter(Boolean);
      for (const n of conflictsFor(chosen, period)) notes.push(`- **${title}** — ${n.text}`);
    }
    if (notes.length) {
      out.push('## Layering notes the app already flagged\n');
      out.push(notes.join('\n') + '\n');
    }
  }

  return out.join('\n');
}

/* Clipboard needs a secure context; localhost counts, but fall back anyway. */
async function copyBriefing() {
  const text = await buildBriefing();
  try {
    await navigator.clipboard.writeText(text);
    return { copied: true, text };
  } catch {
    const field = document.createElement('textarea');
    field.value = text;
    field.style.position = 'fixed';
    field.style.opacity = '0';
    document.body.appendChild(field);
    field.select();
    const copied = document.execCommand('copy');
    field.remove();
    return { copied, text };
  }
}

async function downloadBriefing() {
  const text = await buildBriefing();
  const profile = await store.getActiveProfile();
  const slug = (profile?.name || 'briefing').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const blob = new Blob([text], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `skincare-briefing-${slug}-${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Everything that talks to a model needs your own key, which only makes sense
   on your own machine. The share build flips this to false, leaving the app
   fully offline — the briefing export deliberately survives it. */
const AI_FEATURES = false;   // share build

/* ---------- small helpers ---------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const urls = [];
const imgUrl = blob => {
  const u = URL.createObjectURL(blob);
  urls.push(u);
  return u;
};
function releaseUrls() {
  urls.forEach(URL.revokeObjectURL);
  urls.length = 0;
}

/* app.js hands us its render function so a profile switch can redraw. */
let rerender = () => {};
const onRerender = fn => { rerender = fn; };

/* The masthead switcher. Rebuilt on every render, and after any profile edit. */
async function profileBar() {
  const select = document.getElementById('profile-select');
  if (!select) return;

  const [profiles, active] = await Promise.all([store.getProfiles(), store.getActiveProfileId()]);
  select.innerHTML = profiles.map(p => option(p.id, p.name, active)).join('');
  select.hidden = profiles.length < 2;   // no point offering a choice of one

  select.onchange = async () => {
    await store.setActiveProfileId(select.value);
    // Deep links belong to whoever we just left, so return to the shelf.
    if (/^#\/(product|edit|assess)\//.test(location.hash)) location.hash = '#/';
    else rerender();
  };
}

const fmtDate = s => s
  ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
  : '';

const fmtStamp = iso =>
  new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

/* Two readings on one day should still be tellable apart. */
const fmtStampTime = iso =>
  fmtStamp(iso) + ', ' + new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

const byShelfOrder = (a, b) =>
  (a.brand || '').localeCompare(b.brand || '') || (a.name || '').localeCompare(b.name || '');

/* Three drifting dots for anything that has gone away to think. */
const dots = () => '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';

/* Put a control into its waiting state and hand back the undo. */
function waiting(button, label) {
  const was = button.innerHTML;
  const wasDisabled = button.disabled;
  button.disabled = true;
  button.innerHTML = `${esc(label)}${dots()}`;
  return () => { button.innerHTML = was; button.disabled = wasDisabled; };
}

const tagChip = (t, flag) =>
  `<span class="chip ${flag ? 'chip-flag' : 'chip-active'}">${esc(TAG_LABEL[t] || t)}</span>`;

const option = (v, label, selected) =>
  `<option value="${esc(v)}"${selected === v ? ' selected' : ''}>${esc(label)}</option>`;

function wireDropzone(zone, onFile) {
  const input = zone.querySelector('input[type="file"]');
  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    if (input.files[0]) onFile(input.files[0]);
  });
  ['dragenter', 'dragover'].forEach(e =>
    zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.add('is-over'); }));
  ['dragleave', 'drop'].forEach(e =>
    zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.remove('is-over'); }));
  zone.addEventListener('drop', ev => {
    const file = ev.dataTransfer?.files?.[0];
    if (file) onFile(file);
  });
}

const dropzoneMarkup = (id, caption = 'Drop a photograph, or select one') => `
  <div class="dropzone" id="${id}">
    <p>${esc(caption)}</p>
    <input type="file" accept="image/*">
  </div>`;

const shelfFilters = { category: '', status: '', active: '' };

async function shelf(root) {

  if (!products.length) {

        <a class="btn" href="#/add">Add the first product</a>
      </div>`;
    return;
  }

  const activesPresent = new Set();
  products.forEach(p => tagsFor(p.ingredients || []).forEach(t => {
    if (ACTIVE_TAGS.includes(t)) activesPresent.add(t);
  }));

  const visible = products.filter(p =>
    (!shelfFilters.category || p.category === shelfFilters.category) &&
    (!shelfFilters.status || p.status === shelfFilters.status) &&

  root.innerHTML = `

    <div class="filter-bar">
      <div class="filter">
        <label for="f-cat">Category</label>
        <select id="f-cat">

        </select>
      </div>
      <div class="filter">
        <label for="f-status">Status</label>
        <select id="f-status">
          ${option('', 'All', shelfFilters.status)}
          ${STATUSES.map(s => option(s, STATUS_LABEL[s], shelfFilters.status)).join('')}
        </select>
      </div>
      <div class="filter">
        <label for="f-active">Contains</label>
        <select id="f-active">
          ${option('', 'Anything', shelfFilters.active)}

  for (const p of visible) {
    const blob = await store.getImage(p.imageId);
    const a = document.createElement('a');
    a.className = 'shelf-item';

    a.innerHTML = `
      <div class="shelf-frame">
        ${blob ? `<img src="${imgUrl(blob)}" alt="${esc(p.name)}">` : '<span class="no-image">No photograph</span>'}
      </div>
      <div class="shelf-brand">${esc(p.brand || '—')}</div>
      <div class="shelf-name">${esc(p.name)}</div>
      <div class="shelf-meta">${esc(p.category || '')}${p.status && p.status !== 'active' ? ' · ' + esc(STATUS_LABEL[p.status]) : ''}</div>`;
    grid.appendChild(a);
  }

  root.querySelector('#f-cat').onchange = e => { shelfFilters.category = e.target.value; shelf(root); };
  root.querySelector('#f-status').onchange = e => { shelfFilters.status = e.target.value; shelf(root); };
  root.querySelector('#f-active').onchange = e => { shelfFilters.active = e.target.value; shelf(root); };
}

async function product(root, { id }) {
  const p = await store.getProduct(id);

  if (!p) {
    root.innerHTML = `<div class="empty"><p>That product is no longer in the library.</p>

  }

  }

  const others = (await store.getProfiles()).filter(x => x.id !== activeId);

  const blob = await store.getImage(p.imageId);
  const ingredients = p.ingredients || [];
  const tags = tagsFor(ingredients);
  const actives = ACTIVE_TAGS.filter(t => tags.has(t));

    due.setMonth(due.getMonth() + Number(p.paoMonths));

    expiryNotice = `<div class="notice"><strong>${past ? 'Past its date — ' + esc(dueText) + '.' : 'Use by ' + esc(dueText) + '.'}</strong>

  }

  const spec = [
    ['Category', p.category],
    ['Status', STATUS_LABEL[p.status] || p.status],
    ['Size', p.size],
    ['Price', p.price],
    ['Purchased', fmtDate(p.purchasedAt)],
    ['Opened', fmtDate(p.openedAt)],
    ['Rating', p.rating ? '★'.repeat(Number(p.rating)) + '☆'.repeat(5 - Number(p.rating)) : '']
  ].filter(([, v]) => v);

  root.innerHTML = `
    <p class="label muted" style="margin:0 0 32px"><a href="#/">← The shelf</a></p>
    <div class="detail">
      <div class="detail-frame">
        ${blob ? `<img src="${imgUrl(blob)}" alt="${esc(p.name)}">` : '<span class="no-image">No photograph</span>'}
      </div>
      <div>
        <div class="detail-brand">${esc(p.brand || '—')}</div>
        <h1 class="detail-title">${esc(p.name)}</h1>

        ${actives.length ? `<div class="chips" style="margin-bottom:16px">${actives.map(t => tagChip(t, false)).join('')}</div>` : ''}
        ${flags.length ? `<div class="chips" style="margin-bottom:32px">${flags.map(t => tagChip(t, true)).join('')}</div>` : ''}

        ${expiryNotice}

        <dl class="spec">
          ${spec.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
        </dl>

        ${p.notes ? `<div class="block">
          <h2 class="section-title">Notes</h2>
          <p class="prose" style="white-space:pre-wrap;margin:0">${esc(p.notes)}</p>
        </div>` : ''}

        <div class="block">
          <h2 class="section-title">Ingredients ${ingredients.length ? `— ${matched} of ${ingredients.length} annotated` : ''}</h2>
          ${ingredients.length ? `<div class="ing-list">${ingredients.map((name, i) => {
            const entry = lookup(name);
            const flagged = entry && entry.t.some(t => FLAG_TAGS.includes(t));
            return `<div class="ing ${entry ? '' : 'ing-unknown'} ${flagged ? 'ing-flagged' : ''}">
              <div class="ing-index">${i + 1}</div>
              <div>
                <div class="ing-name">${esc(entry ? entry.n : name)}</div>
                ${entry && entry.n.toLowerCase() !== name.toLowerCase()
                  ? `<div class="tag" style="border:none;margin-top:2px">${esc(name)}</div>` : ''}
                ${entry ? `<div class="ing-tags">${entry.t.map(t =>
                    `<span class="tag ${FLAG_TAGS.includes(t) ? 'tag-flag' : ''}">${esc(TAG_LABEL[t] || t)}</span>`).join('')}</div>` : ''}
              </div>
              <div class="ing-fn">${entry ? esc(entry.f) : 'Not in the reference — recorded as written.'}</div>
            </div>`;
          }).join('')}</div>`
          : '<p class="muted">No ingredient list recorded yet.</p>'}
        </div>

        ${others.length ? `<div class="block">
          <h2 class="section-title">Shared with the household</h2>
          <p class="muted" style="font-size:13px;margin:0 0 20px">If someone else uses this bottle
            too, put a copy on their shelf rather than photographing it twice. The two records are
            separate from then on.</p>
          <div class="btn-row">
            <select id="copy-target" style="background:none;border:none;border-bottom:1px solid var(--rule);padding:4px 0;border-radius:0">
              ${others.map(o => option(o.id, o.name, others[0].id)).join('')}
            </select>
            <button class="btn btn-quiet" id="copy-across">Copy across</button>
            <span class="field-hint" style="margin:0" id="copy-note"></span>
          </div>
        </div>` : ''}

        <div class="block btn-row">
          <a class="btn" href="#/edit/${esc(p.id)}">Edit</a>
          <button class="btn btn-quiet btn-danger" id="delete">Remove from library</button>
        </div>
      </div>
    </div>`;

  const copyBtn = root.querySelector('#copy-across');
  if (copyBtn) {
    copyBtn.onclick = async () => {
      const target = root.querySelector('#copy-target');
      const name = target.selectedOptions[0].text;
      copyBtn.disabled = true;
      try {
        await store.copyProductToProfile(p.id, target.value);
        root.querySelector('#copy-note').textContent = `Copied to ${name}’s shelf.`;
      } catch (err) {
        root.querySelector('#copy-note').textContent = err.message;
      } finally {
        copyBtn.disabled = false;
      }
    };
  }

  root.querySelector('#delete').onclick = async () => {
    if (!confirm(`Remove ${p.brand ? p.brand + ' ' : ''}${p.name} from the library? This cannot be undone.`)) return;
    await store.deleteProduct(p.id);
    location.hash = '#/';
  };
}

          <div class="field">

          </div>
          <div class="field">

          refreshParse();
          return added.length;
        };

        if (read.ingredients?.length) {
          hint.textContent = `Read ${merge(read.ingredients)} ingredients off the pack. `
            + 'Check them before saving.';
        } else {
          /* Nothing legible on the pack — go and look the product up instead. */
          const brand = root.querySelector('#brand').value.trim();
          const name = root.querySelector('#name').value.trim();

          if (!name && !brand) {
            hint.textContent = 'No ingredient list was legible, and there is no product name to look up.';
          } else {
            hint.innerHTML = `No list visible on the pack. Looking up ${esc([brand, name].filter(Boolean).join(' '))}${dots()}`;
            const found = await lookupIngredients({ brand, name });

            if (!found.ingredients.length) {
              hint.textContent = 'No ingredient list was legible, and none could be found online. '
                + 'Try a close, straight-on photograph of the back of the pack.';
            } else {
              const count = merge(found.ingredients);
              hint.innerHTML = found.grounded
                ? `Found ${count} ingredients online for this product — <strong>not read off your pack</strong>, so check them against it. `
                  + `${found.note ? esc(found.note) + ' ' : ''}`
                  + (found.sources?.length
                    ? found.sources.slice(0, 3).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noreferrer noopener" style="text-decoration:underline">${esc(s.title)}</a>`).join(', ')
                    : '')
                : `Found ${count} ingredients, but <strong>web search was unavailable</strong>, so these came from the model’s memory rather than a source. Formulations change — check them against your pack carefully.`;
            }
          }
        }
      } catch (err) {
        hint.textContent = err.message;
      } finally {
        restore();
      }
    };
  }

  root.querySelector('#product-form').onsubmit = async ev => {
    ev.preventDefault();
    const val = sel => root.querySelector(sel).value.trim();
    const error = root.querySelector('#form-error');
    if (!val('#name')) { error.textContent = 'A product name is needed.'; return; }

    const pendingBlob = await pendingPhoto();
    let imageId = p?.imageId || null;
    if (pendingBlob) {
      if (imageId) await store.del('images', imageId).catch(() => {});
      imageId = await store.putImage(pendingBlob);
    }

    await store.saveProduct({
      id: p?.id || store.uid(),
      brand: val('#brand'),
      name: val('#name'),
      category: val('#category'),
      status: val('#status'),
      size: val('#size'),
      price: val('#price'),
      purchasedAt: val('#purchasedAt'),
      openedAt: val('#openedAt'),
      paoMonths: val('#paoMonths'),
      rating: val('#rating'),
      notes: root.querySelector('#notes').value.trim(),
      ingredients: parseIngredients(ingField.value),
      imageId,
      createdAt: p?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });

    location.hash = p ? `#/product/${p.id}` : '#/';
  };
}

function renderResult(result, productsById) {
  const extras = [];

  if (result.degraded) {
    extras.push(`<div class="notice"><strong>Read offline</strong> — the model could not be
      reached (${esc(result.degraded)}), so this is the rules-based reading from your answers.</div>`);
  }
  if (result.photoUsed && result.photoUsable === false && result.photoNote) {
    extras.push(`<div class="notice"><strong>The photograph is hard to judge</strong> — ${esc(result.photoNote)}</div>`);
  }

  const observations = (result.observations || []).length ? `
    <div class="block" style="margin-top:0">
      <h2 class="section-title">What is visible</h2>
      <div class="reading">
        ${result.observations.map(o => `
          <div class="reading-row" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)">
            <div>${esc(o.area)}</div>
            <div class="reading-note">${esc(o.note)}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  const working = (result.working || []).length ? `
    <div class="block">
      <h2 class="section-title">Earning its place</h2>
      <ul class="prose" style="margin:0;padding-left:18px">
        ${result.working.map(w => `<li style="margin-bottom:8px">${esc(w)}</li>`).join('')}
      </ul>
    </div>` : '';

  const changes = (result.changes || []).length ? `
    <div class="block">
      <h2 class="section-title">What to change</h2>
      <div class="reading">
        ${result.changes.map(c => `
          <div class="reading-row" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)">
            <div>${esc(c.change)}</div>
            <div class="reading-note">${esc(c.why)}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  return renderResultBody(result, productsById, extras.join(''), observations, working, changes);
}

function renderResultBody(result, productsById, extras, observations, working, changes) {
  const period = key => (result.routine[key] || []).map((s, i) => `
    <div class="step">
      <div class="step-num">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <div class="step-label">${esc(s.step)}</div>
        ${s.productId && productsById[s.productId]
          ? `<div class="step-product"><a href="#/product/${esc(s.productId)}">${esc(productsById[s.productId].brand || '')} ${esc(productsById[s.productId].name)}</a></div>`
          : '<div class="step-product step-empty">Nothing suitable on the shelf</div>'}
        <div class="step-note">${esc(s.note || '')}</div>
      </div>
    </div>`).join('');

  return `
    <div class="caveat">${esc(result.caveat)}</div>
    ${extras}
    ${observations}

    <div class="block">
      <h2 class="section-title">The reading</h2>
      ${result.concerns.length ? `<div class="reading">${result.concerns.map(c => `
        <div class="reading-row">
          <div>${esc(c.label)}</div>
          <div class="severity ${c.severity === 'marked' ? 'severity-marked' : ''}">${esc(SEVERITY_LABEL[c.severity])}</div>
          <div class="reading-note">${esc(c.evidence)}</div>
        </div>`).join('')}</div>`
        : '<p class="muted">Nothing stands out from your answers. Keep to what is working.</p>'}
    </div>

    ${working}
    ${changes}

    <div class="block">
      <h2 class="section-title">The routine this suggests</h2>
      <div class="routine-cols">
        <div>
          <h3 class="step-label" style="margin-bottom:8px">Morning</h3>
          ${period('am') || '<p class="muted">No morning routine could be built from the shelf.</p>'}
        </div>
        <div>
          <h3 class="step-label" style="margin-bottom:8px">Evening</h3>
          ${period('pm') || '<p class="muted">No evening routine could be built from the shelf.</p>'}
        </div>
      </div>
    </div>

    ${result.gaps.length ? `<div class="block">
      <h2 class="section-title">What is missing</h2>
      ${result.gaps.map(g => `<div class="notice"><strong>${esc(g.category)}</strong> — ${esc(g.reason)}</div>`).join('')}
    </div>` : ''}`;
}

      <div class="assess-grid">

      </div>`;

      await store.deleteAssessment(record.id);
      location.hash = '#/assess';
    };
    return;
  }

  const historyMarkup = history.length ? `
    <div class="block">
      <h2 class="section-title">Previous readings</h2>
      <div class="history">
        ${history.map(a => `
          <button class="history-row" data-id="${esc(a.id)}">
            <span class="history-date">${esc(fmtStampTime(a.date))}</span>
            <span class="muted">${a.result.concerns.length

          </button>`).join('')}
      </div>
    </div>` : '';

  root.innerHTML = `
    <div class="view-head">
      <h1 class="page-title">Assessment</h1>
      <div class="btn-row">
        <button class="btn btn-quiet" id="brief-here">Copy briefing for another assistant</button>

      </div>
    </div>
    <div class="assess-grid">
      <div>
        ${dropzoneMarkup('skin-photo', 'A photograph of your skin')}
        <p class="field-hint">Even daylight, no makeup, the same angle each time. Kept in this
          browser so you can compare one month against the next.</p>
        ${AI_FEATURES && keyConfigured ? `
          <div class="choices" style="margin-top:20px">
            <input type="checkbox" id="send-photo" ${sendPhotoDefault ? 'checked' : ''}>
            <label for="send-photo">Let the model look at it</label>
          </div>
          <p class="field-hint">Off, the reading comes from your answers and your shelf and the
            photograph never leaves this Mac. On, it is sent to ${esc(providerName)} to be read.</p>`
        : ''}
      </div>
      <div>
        <form id="assess-form">
          ${QUESTIONS.map(q => `
            <div class="field">
              <label>${esc(q.label)}</label>
              <div class="choices">
                ${q.options.map((o, i) => `
                  <input type="${q.multi ? 'checkbox' : 'radio'}" name="${esc(q.key)}"
                         id="${esc(q.key)}-${i}" value="${esc(o.value)}"${!q.multi && i === 0 ? ' checked' : ''}>
                  <label for="${esc(q.key)}-${i}">${esc(o.label)}</label>`).join('')}
              </div>
            </div>`).join('')}
          <div class="btn-row">
            <button type="submit" class="btn">Read my skin</button>

        img.src = imgUrl(blob);

    const record = {

      </div></div>`;

      await store.setRoutine({ am: entries('am'), pm: entries('pm') });
      out.querySelector('#adopt-note').textContent = 'Saved. It is now under Routine.';
    };
  };
}

async function routine(root) {
  const products = (await store.getProducts()).sort(byShelfOrder);
  const saved = await store.getRoutine();
  const byId = Object.fromEntries(products.map(p => [p.id, p]));

  if (!products.length) {
    root.innerHTML = `<div class="view-head"><h1 class="page-title">Routine</h1></div>
      <div class="empty"><p>A routine is assembled from what is on the shelf. Add a product first.</p>
      <a class="btn" href="#/add">Add a product</a></div>`;
    return;
  }

  /* Everything below edits this draft; Save writes it. */
  const draft = { am: [...(saved.am || [])], pm: [...(saved.pm || [])] };
  const inStep = (period, key) => draft[period].filter(e => e.step === key);

  const stepRows = (period, step) => {
    const chosen = inStep(period, step.key);
    const taken = new Set(chosen.map(e => e.productId));
    const candidates = products.filter(p => step.categories.includes(p.category) && !taken.has(p.id));
    const canAdd = step.multiple ? candidates.length > 0 : chosen.length === 0 && candidates.length > 0;

    const rows = chosen.map((entry, i) => {
      const p = byId[entry.productId];
      if (!p) return '';
      return `<div class="picker-row">
        <span class="picker-step" style="min-width:110px">${i === 0 ? esc(step.label) : ''}</span>
        <span class="grow">${esc(p.brand ? p.brand + ' · ' : '')}${esc(p.name)}</span>
        ${i > 0 ? `<button class="link-btn" data-up="${esc(period)}|${esc(step.key)}|${i}">Move up</button>` : ''}
        <button class="link-btn" data-drop="${esc(period)}|${esc(entry.productId)}|${esc(step.key)}">Remove</button>
      </div>`;
    }).join('');

    const adder = canAdd
      ? `<div class="picker-row">
          <span class="picker-step" style="min-width:110px">${chosen.length ? '' : esc(step.label)}</span>
          <span class="grow">
            <select class="step-add" data-add="${esc(period)}|${esc(step.key)}"
                    style="width:100%;background:none;border:none;border-bottom:1px solid var(--rule);padding:4px 0;border-radius:0">
              ${option('', chosen.length ? '＋ add another' : '—', '')}
              ${candidates.map(p => option(p.id, `${p.brand ? p.brand + ' · ' : ''}${p.name}`, '')).join('')}
            </select>
          </span>
        </div>`
      : (chosen.length ? '' : `<div class="picker-row">
          <span class="picker-step" style="min-width:110px">${esc(step.label)}</span>
          <span class="grow muted">Nothing in this category</span>
        </div>`);

    return rows + adder;
  };

  const column = (period, title) => `
    <div>
      <h2 class="section-title">${esc(title)}</h2>
      <div class="picker">
        ${stepsFor(period).map(step => stepRows(period, step)).join('')}
      </div>
      <div id="conflicts-${period}" class="block" style="margin-top:32px"></div>
    </div>`;

  const draw = () => {
    root.innerHTML = `
      <div class="view-head">
        <h1 class="page-title">Routine</h1>
        <div class="btn-row">
          <button class="btn" id="save-routine">Save</button>
          <span class="field-hint" style="margin:0" id="routine-note"></span>
        </div>
      </div>
      <div class="routine-cols">
        ${column('am', 'Morning')}
        ${column('pm', 'Evening')}
      </div>`;

    for (const period of ['am', 'pm']) {
      const chosen = draft[period].map(e => byId[e.productId]).filter(Boolean);
      const notes = conflictsFor(chosen, period);
      root.querySelector(`#conflicts-${period}`).innerHTML = notes.length
        ? `<h2 class="section-title">Worth knowing</h2>${notes.map(n =>
            `<div class="notice"><strong>${n.severity === 'high' ? 'Take care' : n.severity === 'medium' ? 'Consider' : 'Note'}</strong> — ${esc(n.text)}</div>`).join('')}`
        : (chosen.length ? '<p class="muted" style="font-size:13px">Nothing conflicts in this routine.</p>' : '');
    }
    wire();
  };

  function wire() {
    root.querySelectorAll('.step-add').forEach(sel => {
      sel.onchange = () => {
        if (!sel.value) return;
        const [period, stepKey] = sel.dataset.add.split('|');
        draft[period].push({ step: stepKey, productId: sel.value });
        draw();
      };
    });

    root.querySelectorAll('[data-drop]').forEach(btn => {
      btn.onclick = () => {
        const [period, productId, stepKey] = btn.dataset.drop.split('|');
        const i = draft[period].findIndex(e => e.productId === productId && e.step === stepKey);
        if (i > -1) draft[period].splice(i, 1);
        draw();
      };
    });

    /* Swap with the entry above it inside the same step. */
    root.querySelectorAll('[data-up]').forEach(btn => {
      btn.onclick = () => {
        const [period, stepKey, indexText] = btn.dataset.up.split('|');
        const within = Number(indexText);
        const positions = draft[period]
          .map((e, i) => (e.step === stepKey ? i : -1))
          .filter(i => i > -1);
        const a = positions[within - 1];
        const b = positions[within];
        [draft[period][a], draft[period][b]] = [draft[period][b], draft[period][a]];
        draw();
      };
    });

    root.querySelector('#save-routine').onclick = async () => {
      await store.setRoutine({ am: draft.am, pm: draft.pm });
      root.querySelector('#routine-note').textContent = 'Saved.';
    };
  }

  draw();
}

          discontinued or misremembered. Verify each one before buying.</div>` : ''}
        <p class="muted" style="margin-bottom:32px">Found ${esc(fmtStamp(picks.generatedAt))}${stale ? ' — over a month ago, worth looking again.' : '.'}

        <div class="picks">
          ${(picks.items || []).map(item => `
            <div class="pick">
              <div>
                <div class="pick-brand">${esc(item.brand || '')}</div>
                <div class="pick-name">${esc(item.product || '')}</div>
                <div class="pick-kind">${esc(item.kind || '')}</div>

              <div>

                ${item.actives ? `<div class="pick-meta"><strong>Actives</strong> — ${esc(item.actives)}</div>` : ''}
                ${item.caution ? `<div class="pick-meta"><strong>Caution</strong> — ${esc(item.caution)}</div>` : ''}
              </div>
            </div>`).join('')}
        </div>
        ${(picks.sources || []).length ? `<div class="block">
          <h2 class="section-title">Where this came from</h2>
          <div class="chips">
            ${picks.sources.map(s => `<a class="chip" href="${esc(s.url)}" target="_blank" rel="noreferrer noopener">${esc(s.title)}</a>`).join('')}
          </div>
        </div>` : ''}`
      : `<div class="empty"><p>Nothing looked up yet.</p></div>`}`;

    root.querySelector('#look').onclick = async () => {
      const button = root.querySelector('#look');
      const restore = waiting(button, 'Searching');
      root.querySelector('#pick-note').innerHTML = `This takes a moment${dots()}`;
      try {

  paint(cached, '');
